<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA EARN</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:
radial-gradient(circle at top,#3b2a00,#050505 50%);
color:white;
min-height:100vh;
}


.app{
max-width:450px;
margin:auto;
padding:20px;
}


.logo{
text-align:center;
font-size:50px;
margin-top:20px;
}


.title{
text-align:center;
font-size:32px;
font-weight:bold;
color:#facc15;
}


.subtitle{
text-align:center;
color:#aaa;
margin-bottom:25px;
}



.card{

background:rgba(20,20,20,.9);
border:1px solid #333;
border-radius:25px;
padding:20px;
margin-bottom:20px;
box-shadow:0 0 30px #000;

}



.balance{

text-align:center;
background:linear-gradient(135deg,#facc15,#b45309);
color:#111;
border-radius:25px;
padding:25px;

}


.balance h1{

font-size:45px;
margin:10px;

}



.stats{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;

}



.stat{

background:#111;
padding:15px;
border-radius:18px;
text-align:center;

}



.stat b{

display:block;
font-size:25px;
color:#facc15;

}



button{

width:100%;
padding:17px;
border:0;
border-radius:20px;
font-size:18px;
font-weight:bold;
margin-top:15px;
cursor:pointer;

}



.ads{

background:#22c55e;
color:white;

}



.withdraw{

background:#2563eb;
color:white;

}



.invite{

background:#f59e0b;
color:#111;

}



.loading{

opacity:.6;
}



.footer{

text-align:center;
color:#777;
font-size:13px;

}

</style>

</head>


<body>


<div class="app">


<div class="logo">
🌌
</div>


<div class="title">
NOVA EARN
</div>


<div class="subtitle">
Earn rewards with AdsGram
</div>




<div class="card">


<div class="balance">

رصيدك الحالي

<h1 id="points">
0
</h1>

نقطة

</div>


</div>





<div class="card">


<div class="stats">


<div class="stat">

<b id="adsCount">
0
</b>

إعلانات مكتملة

</div>


<div class="stat">

<b id="level">
1
</b>

المستوى

</div>


</div>


</div>






<div class="card">


<h2>
🎬 AdsGram Reward
</h2>


<p>
شاهد الإعلان واحصل على نقاط
</p>


<button class="ads">
🎥 مشاهدة إعلان +10 نقاط
</button>


</div>







<div class="card">


<button class="invite">
👥 دعوة الأصدقاء
</button>


<button class="withdraw">
💸 طلب سحب
</button>


</div>



<div class="footer">
NOVA EARN © 2026
</div>



</div>





<script>


let points =
Number(localStorage.getItem("points")) || 0;


let ads =
Number(localStorage.getItem("ads")) || 0;



function update(){

document.getElementById("points").innerHTML = points;

document.getElementById("adsCount").innerHTML = ads;

document.getElementById("level").innerHTML =
Math.floor(points / 100) + 1;


localStorage.setItem("points",points);

localStorage.setItem("ads",ads);

}



update();




// AdsGram

const AdController = window.Adsgram.init({

blockId:"40248"

});





document.querySelector(".ads").onclick = async function(){


let btn=this;

btn.classList.add("loading");

btn.innerHTML="⏳ جاري تحميل الإعلان...";


try{


await AdController.show();


points += 10;

ads++;


update();


alert("🎉 حصلت على 10 نقاط");


}

catch(error){


console.log(error);


alert("❌ لا يوجد إعلان متاح حاليا");


}


btn.classList.remove("loading");

btn.innerHTML="🎥 مشاهدة إعلان +10 نقاط";


};







document.querySelector(".invite").onclick=function(){


let link =
"https://t.me/test_rewards_libya_bot";


navigator.clipboard.writeText(link);


alert("✅ تم نسخ رابط الدعوة");


};






document.querySelector(".withdraw").onclick=function(){


if(points < 1000){

alert("الحد الأدنى للسحب 1000 نقطة");

return;

}


alert("💸 سيتم مراجعة طلب السحب");


};







if(window.Telegram && Telegram.WebApp){


Telegram.WebApp.ready();


let user =
Telegram.WebApp.initDataUnsafe.user;


if(user){

document.querySelector(".subtitle").innerHTML =
"مرحبا "+user.first_name+" 👋";

}


}



</script>


</body>
</html>
