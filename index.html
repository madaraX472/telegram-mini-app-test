<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Madara Crypto - Pixel Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }
    body { background-color: #0d1117; color: #f0f6fc; min-height: 100vh; display: flex; justify-content: center; align-items: center; overflow-x: hidden; }
    
    .pixel-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(180deg, #050814 0%, #0d1b2a 60%, #1b263b 100%); z-index: -1; overflow: hidden; }
    .moon { position: absolute; top: 15px; right: 20px; width: 45px; height: 45px; background: #e0e1dd; border-radius: 50%; box-shadow: 0 0 15px rgba(224, 225, 221, 0.3), inset -6px -4px 0px #778da9; opacity: 0.8; }
    .star { position: absolute; background: #fff; width: 2px; height: 2px; opacity: 0.8; animation: twinkle 2s infinite alternate; }
    @keyframes twinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.3); } }
    .snowflake { position: absolute; color: #e0e1dd; font-size: 10px; opacity: 0.7; animation: fall linear infinite; }
    @keyframes fall { 0% { transform: translateY(-10px); } 100% { transform: translateY(100vh); } }
    
    .app-container { width: 100%; max-width: 450px; min-height: 100vh; padding: 15px 16px 80px 16px; display: flex; flex-direction: column; position: relative; }
    .app-header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 2px dashed rgba(255, 255, 255, 0.1); margin-bottom: 15px; }
    .brand { display: flex; align-items: center; gap: 8px; }
    .pixel-title { font-family: 'Press Start 2P', cursive; font-size: 13px; color: #00f5d4; text-shadow: 2px 2px #000; }
    .user-pill { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); padding: 5px 10px; border-radius: 20px; font-size: 11px; display: flex; align-items: center; gap: 6px; z-index: 2; }
    .status-dot { width: 7px; height: 7px; background: #38b000; border-radius: 50%; box-shadow: 0 0 8px #38b000; }
    
    .page { display: none; animation: fadeIn 0.3s ease-in-out; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    .balance-card { background: rgba(13, 27, 42, 0.85); border: 2px solid #415a77; border-radius: 16px; padding: 18px; text-align: center; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); margin-bottom: 15px; }
    .card-label { font-size: 13px; color: #778da9; }
    .balance-value { font-size: 32px; font-weight: 900; color: #70e000; margin: 8px 0; font-family: 'Press Start 2P', cursive; text-shadow: 0 0 10px rgba(112, 224, 0, 0.3); }
    .pixel-badge { display: inline-block; background: #1b263b; color: #e0e1dd; font-size: 10px; padding: 4px 8px; border-radius: 6px; border: 1px solid #778da9; }
    
    .knight-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 15px 0; text-align: center; }
    .knight-avatar { width: 130px; height: 130px; border-radius: 50%; border: 3px solid #00f5d4; box-shadow: 0 0 20px rgba(0, 245, 212, 0.4); object-fit: cover; animation: float 3s ease-in-out infinite; background: #1b263b; }
    @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    .knight-title { margin-top: 10px; font-family: 'Press Start 2P', cursive; font-size: 10px; color: #e0e1dd; text-shadow: 1px 1px #000; }

    .quick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .stat-box { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
    .stat-title { font-size: 11px; color: #a0aab0; }
    .stat-num { font-size: 13px; font-weight: 700; color: #00f5d4; font-family: 'Press Start 2P', cursive; }
    
    .section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #e0e1dd; }
    .task-card { background: rgba(13, 27, 42, 0.7); border: 1px solid #415a77; border-radius: 12px; padding: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .task-info { display: flex; align-items: center; gap: 10px; }
    .task-icon { font-size: 22px; }
    .task-info h3 { font-size: 13px; color: #fff; }
    .reward-tag { font-size: 11px; color: #70e000; font-weight: bold; }
    .pixel-btn { border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 0px rgba(0, 0, 0, 0.4); }
    .pixel-btn:active { transform: translateY(2px); box-shadow: 0 2px 0px rgba(0, 0, 0, 0.4); }
    .btn-primary { background: #00b4d8; color: #000; }
    .btn-secondary { background: #7209b7; color: #fff; }
    .btn-success { background: #38b000; color: #000; width: 100%; padding: 12px; font-size: 14px; margin-top: 10px; }
    .withdraw-card, .referral-card { background: rgba(13, 27, 42, 0.7); border: 1px solid #415a77; border-radius: 12px; padding: 16px; }
    .withdraw-note { font-size: 12px; color: #a0aab0; margin-bottom: 12px; }
    .input-group { margin-bottom: 10px; }
    .input-group label { display: block; font-size: 11px; color: #e0e1dd; margin-bottom: 5px; }
    .pixel-input { width: 100%; background: rgba(0, 0, 0, 0.3); border: 1px solid #415a77; padding: 10px; border-radius: 8px; color: #fff; font-size: 12px; outline: none; }
    .pixel-input:focus { border-color: #00f5d4; }
    
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; max-width: 450px; margin: 0 auto; background: rgba(13, 27, 42, 0.95); border-top: 1px solid #415a77; display: flex; justify-content: space-around; padding: 8px 0; backdrop-filter: blur(10px); }
    .nav-item { background: none; border: none; color: #778da9; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; cursor: pointer; }
    .nav-item.active { color: #00f5d4; font-weight: bold; }
    .nav-icon { font-size: 16px; }
    .toast { position: fixed; bottom: 70px; left: 50%; transform: translateX(-50%); background: #1b263b; color: #fff; padding: 8px 16px; border-radius: 20px; border: 1px solid #00f5d4; font-size: 12px; display: none; z-index: 1000; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); }
  </style>
</head>
<body>

  <div class="pixel-bg">
    <div class="moon"></div>
    <div id="stars-container"></div>
    <div id="snow-container"></div>
  </div>

  <div class="app-container">
    <header class="app-header">
      <div class="brand">
        <span class="pixel-icon">🌲</span>
        <h1 class="pixel-title">Madara Crypto</h1>
      </div>
      <div class="user-pill">
        <span class="status-dot"></span>
        <span id="user-display-name">المستخدم</span>
      </div>
    </header>

    <!-- الرئيسية -->
    <main id="page-home" class="page active">
      <div class="balance-card">
        <span class="card-label">الرصيد الحالي (USDT)</span>
        <div class="balance-value" id="user-balance">0.0000</div>
        <div class="pixel-badge">شبكة BEP20</div>
      </div>

      <div class="knight-container">
        <!-- رابط مباشر لصورة الفارس بدون مشاكل حجب -->
        <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/dragon-scale.png" onerror="this.src='https://api.iconify.design/game-icons:knight-helmet.svg?color=%2300f5d4'" alt="Pixel Knight" class="knight-avatar">
        <div class="knight-title">⚔️ Praise The Sun! ⚔️</div>
      </div>

      <div class="quick-stats">
        <div class="stat-box">
          <span class="stat-title">مكافأة Adsgram</span>
          <span class="stat-num">+1.00$</span>
        </div>
        <div class="stat-box">
          <span class="stat-title">مكافأة Adsterra</span>
          <span class="stat-num">+1.00$</span>
        </div>
      </div>
    </main>

    <!-- المهام -->
    <main id="page-tasks" class="page">
      <div class="section-title">⚔️ المهام المتاحة</div>
      <div class="task-card">
        <div class="task-info">
          <div class="task-icon">📺</div>
          <div>
            <h3>إعلان Adsgram</h3>
            <p class="reward-tag">+1.00 USDT</p>
          </div>
        </div>
        <button class="pixel-btn btn-primary" onclick="handleAdsgramClick()">مشاهدة</button>
      </div>
      <div class="task-card">
        <div class="task-info">
          <div class="task-icon">🚀</div>
          <div>
            <h3>رابط Adsterra الذكي</h3>
            <p class="reward-tag">+1.00 USDT</p>
          </div>
        </div>
        <button class="pixel-btn btn-secondary" onclick="handleAdsterraClick()">زيارة الإعلان</button>
      </div>
    </main>

    <!-- السحب -->
    <main id="page-withdraw" class="page">
      <div class="section-title">💳 سحب الأرباح</div>
      <div class="withdraw-card">
        <p class="withdraw-note">الحد الأدنى للسحب هو <b>0.05 USDT</b> عبر شبكة BEP20.</p>
        <div class="input-group">
          <label>عنوان محفظة BEP20:</label>
          <input type="text" id="wallet-address" class="pixel-input" placeholder="0x..." />
        </div>
        <button class="pixel-btn btn-success" onclick="submitWithdrawal()">طلب السحب الآن</button>
      </div>
      <div class="section-title" style="margin-top: 15px;">👥 رابط الإحالة</div>
      <div class="referral-card">
        <input type="text" id="ref-link-input" class="pixel-input" readonly value="جاري التحميل..." />
        <button class="pixel-btn btn-primary" style="margin-top: 8px; width: 100%;" onclick="copyRefLink()">نسخ الرابط</button>
      </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchPage('home', this)">
        <span class="nav-icon">🏠</span>
        <span>الرئيسية</span>
      </button>
      <button class="nav-item" onclick="switchPage('tasks', this)">
        <span class="nav-icon">⚔️</span>
        <span>المهام</span>
      </button>
      <button class="nav-item" onclick="switchPage('withdraw', this)">
        <span class="nav-icon">💳</span>
        <span>السحب</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const ADSTERRA_URL = "https://www.effectivecpmnetwork.com/jbniegah77key=c25a066401baecd24398a891da71d0e5";
    const ADSGRAM_BLOCK_ID = "40248"; 
    const BOT_TOKEN = "YOUR_BOT_TOKEN"; 
    const ADMIN_CHAT_ID = "YOUR_ADMIN_CHAT_ID"; 

    // تم تعديل قيمة المكافآت إلى 1$
    const REWARD_ADSGRAM = 1.00;
    const REWARD_ADSTERRA = 1.00;

    let userBalance = 0.0000;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        const u = tg.initDataUnsafe.user;
        const userDisplay = document.getElementById('user-display-name');
        if (userDisplay) userDisplay.innerText = u.first_name || u.username || "المستخدم";
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      if (!t) return;
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3500);
    }

    function switchPage(pageId, element) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      const targetPage = document.getElementById(`page-${pageId}`);
      if (targetPage) targetPage.classList.add('active');
      if (element) element.classList.add('active');
    }

    function updateBalance() {
      const balanceElem = document.getElementById('user-balance');
      if (balanceElem) balanceElem.innerText = userBalance.toFixed(4);
      localStorage.setItem('userBalance', userBalance.toString());
    }

    function loadUserData() {
      const savedBalance = localStorage.getItem('userBalance');
      if (savedBalance !== null) {
        userBalance = parseFloat(savedBalance);
        updateBalance();
      }
      const userId = tg?.initDataUnsafe?.user?.id || '123456';
      const refInput = document.getElementById('ref-link-input');
      if (refInput) refInput.value = `https://t.me/MadaraCryptoBot?start=${userId}`;
    }

    // إعلان Adsgram (بدون مؤقت)
    function handleAdsgramClick() {
      if (window.Adsgram) {
        const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        AdController.show().then((result) => {
          userBalance += REWARD_ADSGRAM;
          updateBalance();
          showToast("🎉 تم إضافة +1.00 USDT بنجاح!");
        }).catch((result) => {
          showToast("❌ لم يتم إكمال الإعلان!");
        });
      } else {
        userBalance += REWARD_ADSGRAM;
        updateBalance();
        showToast("🎉 (وضع تجريبي) تم إضافة +1.00 USDT!");
      }
    }

    // إعلان Adsterra (مباشر وبدون انتظار)
    function handleAdsterraClick() {
      if (tg && tg.openLink) { 
        tg.openLink(ADSTERRA_URL); 
      } else { 
        window.open(ADSTERRA_URL, '_blank'); 
      }
      
      userBalance += REWARD_ADSTERRA;
      updateBalance();
      showToast("🎉 تم إضافة +1.00 USDT بنجاح!");
    }

    function copyRefLink() {
      const refInput = document.getElementById('ref-link-input');
      if (refInput) {
        refInput.select();
        document.execCommand('copy');
        showToast("📋 تم نسخ رابط الإحالة!");
      }
    }

    function submitWithdrawal() {
      const walletInput = document.getElementById('wallet-address');
      const wallet = walletInput ? walletInput.value.trim() : '';
      if (!wallet || (!wallet.startsWith('0x') && wallet.length < 10)) {
        showToast("⚠️ يرجى إدخال عنوان محفظة BEP20 صحيح!");
        return;
      }
      if (userBalance < 0.05) {
        showToast("⚠️ الحد الأدنى للسحب هو 0.05 USDT!");
        return;
      }
      const userName = tg?.initDataUnsafe?.user?.first_name || 'غير معروف';
      const userId = tg?.initDataUnsafe?.user?.id || 'غير معروف';
      const userHandle = tg?.initDataUnsafe?.user?.username ? `@${tg.initDataUnsafe.user.username}` : 'لا يوجد';
      const message = `🌲 *طلب سحب جديد - Madara Crypto*\n\n` +
                      `👤 *المستخدم:* ${userName} (${userHandle})\n` +
                      `🆔 *الآيدي:* \`${userId}\`\n` +
                      `💰 *المبلغ المطلوب:* \`${userBalance.toFixed(4)} USDT\`\n` +
                      `🏦 *عنوان المحفظة (BEP20):*\n\`${wallet}\``;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'Markdown' })
      })
      .then(res => {
        userBalance = 0;
        updateBalance();
        if (walletInput) walletInput.value = '';
        showToast("✅ تم إرسال طلب السحب بنجاح إلى الإدارة!");
      })
      .catch(err => {
        showToast("❌ حدث خطأ أثناء إرسال الطلب، تحقق من البيانات.");
      });
    }

    function createAtmosphere() {
      const starsContainer = document.getElementById('stars-container');
      const snowContainer = document.getElementById('snow-container');
      if (starsContainer) {
        for (let i = 0; i < 35; i++) {
          const star = document.createElement('div');
          star.className = 'star';
          star.style.left = `${Math.random() * 100}%`;
          star.style.top = `${Math.random() * 60}%`;
          star.style.animationDelay = `${Math.random() * 2}s`;
          starsContainer.appendChild(star);
        }
      }
      if (snowContainer) {
        for (let i = 0; i < 15; i++) {
          const snow = document.createElement('div');
          snow.className = 'snowflake';
          snow.innerText = '❄';
          snow.style.left = `${Math.random() * 100}%`;
          snow.style.animationDuration = `${Math.random() * 3 + 4}s`;
          snow.style.animationDelay = `${Math.random() * 2}s`;
          snowContainer.appendChild(snow);
        }
      }
    }

    window.onload = () => {
      loadUserData();
      createAtmosphere();
    };
  </script>
</body>
</html>
