<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Madara: The Last Blade 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050508;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Vignette & Cinematic Overlay */
        .cinematic-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
            background: radial-gradient(circle, transparent 60%, rgba(5, 5, 10, 0.6) 100%);
        }

        /* UI HUD Overlay */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .bar-container {
            width: 45%;
            background: rgba(10, 10, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .entity-title {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .player-name { color: #4facfe; }
        .enemy-name { color: #ff0844; }

        .progress-bg {
            width: 100%;
            height: 14px;
            background: rgba(250, 250, 250, 0.1);
            border-radius: 7px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 100%;
            transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 7px;
        }

        .player-hp-fill {
            background: linear-gradient(90deg, #00f2fe 0%, #4facfe 100%);
            box-shadow: 0 0 10px rgba(79, 172, 254, 0.6);
        }

        .enemy-hp-fill {
            background: linear-gradient(90deg, #ff0844 0%, #ffb199 100%);
            box-shadow: 0 0 10px rgba(255, 8, 68, 0.6);
        }

        .stamina-fill {
            background: linear-gradient(90deg, #f6d365 0%, #fda085 100%);
            margin-top: 4px;
            height: 6px;
        }

        .stage-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            color: #d4af37;
            letter-spacing: 2px;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
            backdrop-filter: blur(6px);
        }

        /* Controls Area */
        .controls-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: auto;
            padding-bottom: 10px;
        }

        .joystick-area {
            width: 130px;
            height: 130px;
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 70px);
            grid-gap: 15px;
        }

        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(20, 20, 30, 0.75);
            color: white;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            touch-action: manipulation;
        }

        .btn:active {
            transform: scale(0.92);
            background: rgba(50, 50, 75, 0.9);
        }

        .btn-attack {
            background: linear-gradient(135deg, rgba(255, 8, 68, 0.4), rgba(150, 0, 30, 0.8));
            border-color: rgba(255, 8, 68, 0.6);
            grid-column: 2;
            grid-row: 1;
            width: 75px;
            height: 75px;
        }

        .btn-parry {
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.4), rgba(120, 95, 10, 0.8));
            border-color: rgba(212, 175, 55, 0.6);
            grid-column: 1;
            grid-row: 1;
        }

        .btn-dodge {
            background: linear-gradient(135deg, rgba(79, 172, 254, 0.4), rgba(0, 90, 180, 0.8));
            border-color: rgba(79, 172, 254, 0.6);
            grid-column: 2;
            grid-row: 2;
        }

        .btn-heavy {
            background: linear-gradient(135deg, rgba(155, 89, 182, 0.4), rgba(90, 30, 120, 0.8));
            border-color: rgba(155, 89, 182, 0.6);
            grid-column: 1;
            grid-row: 2;
        }

        .btn span {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }

        /* Modal Overlay */
        .modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.85);
            backdrop-filter: blur(12px);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .modal-title {
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(45deg, #d4af37, #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .modal-subtitle {
            font-size: 14px;
            color: #aaa;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .start-btn {
            padding: 14px 40px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #111;
            background: linear-gradient(90deg, #d4af37 0%, #f6d365 100%);
            border: none;
            border-radius: 30px;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.5);
            cursor: pointer;
            transition: all 0.2s;
        }

        .start-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* Floating Damage Text */
        .damage-popup {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            pointer-events: none;
            animation: popupAnim 0.8s ease-out forwards;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        @keyframes popupAnim {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            50% { transform: translateY(-30px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-50px) scale(1); }
        }

        /* Combo Counter */
        #combo-container {
            position: absolute;
            top: 100px;
            right: 30px;
            text-align: right;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .combo-count {
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            color: #ff0844;
            text-shadow: 0 0 15px rgba(255, 8, 68, 0.8);
        }

        .combo-title {
            font-size: 12px;
            letter-spacing: 3px;
            color: #ddd;
        }
    </style>
    <!-- Three.js for Realistic 3D Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container"></div>
    <div class="cinematic-overlay"></div>

    <div id="hud">
        <div class="stage-indicator" id="stage-txt">المرحلة 1: المحارب المظلم</div>

        <div class="stats-bar">
            <!-- Player Stats -->
            <div class="bar-container">
                <div class="entity-title">
                    <span class="player-name">مادارا</span>
                    <span id="player-hp-txt">100/100</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill player-hp-fill" id="player-hp-bar"></div>
                </div>
                <div class="progress-bg stamina-fill">
                    <div class="progress-fill" id="player-stamina-bar" style="background: #f6d365; width: 100%;"></div>
                </div>
            </div>

            <!-- Enemy Stats -->
            <div class="bar-container">
                <div class="entity-title">
                    <span class="enemy-name" id="enemy-title-txt">حارس البرج</span>
                    <span id="enemy-hp-txt">150/150</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill enemy-hp-fill" id="enemy-hp-bar"></div>
                </div>
            </div>
        </div>

        <div id="combo-container">
            <div class="combo-count" id="combo-num">0</div>
            <div class="combo-title">ضربات متتالية</div>
        </div>

        <div class="controls-container">
            <!-- Left Side Move Joystick placeholder / Touch Move -->
            <div class="joystick-area" id="move-pad">
                <span style="font-size: 11px; color: rgba(255,255,255,0.4); text-align: center;">اسحب للتحرك<br>Move</span>
            </div>

            <!-- Action Buttons -->
            <div class="action-buttons">
                <button class="btn btn-attack" id="btn-attack">
                    ⚔️
                    <span>هجوم</span>
                </button>
                <button class="btn btn-parry" id="btn-parry">
                    🛡️
                    <span>صدّ (Parry)</span>
                </button>
                <button class="btn btn-dodge" id="btn-dodge">
                    💨
                    <span>تفادي</span>
                </button>
                <button class="btn btn-heavy" id="btn-heavy">
                    🔥
                    <span>ضربة قاطعة</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Start / GameOver Modal -->
    <div class="modal" id="game-modal">
        <div class="modal-title" id="modal-title">MADARA: THE LAST BLADE</div>
        <div class="modal-subtitle" id="modal-desc">
            لعبة قتال ثلاثية الأبعاد بواقعية عالية.<br>
            استخدم مهارة الصدّ (Parry) والتفادي في الوقت المناسب لكسر دفاعات الأعداء والزعماء.
        </div>
        <button class="start-btn" id="modal-btn" onclick="startGame()">بدء المعركة</button>
    </div>

    <script>
        /* --- GAME ENGINE & STATE --- */
        let scene, camera, renderer;
        let playerGroup, enemyGroup;
        let playerSword, enemySword;
        let clock = new THREE.Clock();

        // Game Variables
        let player = {
            hp: 100,
            maxHp: 100,
            stamina: 100,
            maxStamina: 100,
            isAttacking: false,
            isParrying: false,
            isDodging: false,
            dodgeCooldown: false,
            position: new THREE.Vector3(0, 0, 3)
        };

        let enemy = {
            hp: 150,
            maxHp: 150,
            isAttacking: false,
            attackTimer: 0,
            state: 'idle', // idle, attack, stunned, dead
            position: new THREE.Vector3(0, 0, -3),
            type: 1
        };

        let currentStage = 1;
        let comboHits = 0;
        let comboTimeout;
        let gameActive = false;

        // Particle System for Sparks & Hits
        let particles = [];

        function init3D() {
            const container = document.getElementById('game-container');

            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.FogExp2(0x0a0a12, 0.04);

            // Camera setup
            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 3.5, 7.5);
            camera.lookAt(0, 1.2, 0);

            // Renderer setup
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            // Lighting System
            const ambientLight = new THREE.AmbientLight(0x222233, 1.5);
            scene.add(ambientLight);

            const mainLight = new THREE.DirectionalLight(0xffecd1, 2.5);
            mainLight.position.set(5, 12, 7);
            mainLight.castShadow = true;
            mainLight.shadow.mapSize.width = 2048;
            mainLight.shadow.mapSize.height = 2048;
            mainLight.shadow.bias = -0.0005;
            scene.add(mainLight);

            // Colored Rim Lights for Realistic Atmospheric Depth
            const rimLight1 = new THREE.PointLight(0x4facfe, 3, 15);
            rimLight1.position.set(-6, 4, -4);
            scene.add(rimLight1);

            const rimLight2 = new THREE.PointLight(0xff0844, 2, 15);
            rimLight2.position.set(6, 4, -4);
            scene.add(rimLight2);

            // Create Arena Floor (Detailed Stone Look)
            createArena();

            // Create Entities
            createPlayer();
            createEnemy();

            window.addEventListener('resize', onWindowResize);
            setupInput();

            // Start Animation Loop
            animate();
        }

        function createArena() {
            // Floor Geometry
            const floorGeo = new THREE.CircleGeometry(12, 64);
            const floorMat = new THREE.MeshStandardMaterial({
                color: 0x1a1a24,
                roughness: 0.6,
                metalness: 0.3
            });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);

            // Outer Ring Pillar Details
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2;
                const radius = 11;
                const pillarGeo = new THREE.CylinderGeometry(0.4, 0.6, 5, 16);
                const pillarMat = new THREE.MeshStandardMaterial({ color: 0x12121c, roughness: 0.8 });
                const pillar = new THREE.Mesh(pillarGeo, pillarMat);
                pillar.position.set(Math.cos(angle) * radius, 2.5, Math.sin(angle) * radius);
                pillar.castShadow = true;
                pillar.receiveShadow = true;
                scene.add(pillar);

                // Small Ember Light on Top of Pillars
                const ember = new THREE.PointLight(0xff7700, 1, 6);
                ember.position.set(Math.cos(angle) * radius, 5.2, Math.sin(angle) * radius);
                scene.add(ember);
            }
        }

        function createPlayer() {
            playerGroup = new THREE.Group();

            // Body (Realistic Armor Shape)
            const torsoGeo = new THREE.CylinderGeometry(0.35, 0.25, 1.1, 16);
            const armorMat = new THREE.MeshStandardMaterial({
                color: 0x2c3e50,
                metalness: 0.8,
                roughness: 0.2
            });
            const torso = new THREE.Mesh(torsoGeo, armorMat);
            torso.position.y = 1.1;
            torso.castShadow = true;
            playerGroup.add(torso);

            // Head / Helmet
            const headGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x111118, metalness: 0.9, roughness: 0.1 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.85;
            head.castShadow = true;
            playerGroup.add(head);

            // Glowing Visor
            const visorGeo = new THREE.BoxGeometry(0.22, 0.05, 0.1);
            const visorMat = new THREE.MeshBasicMaterial({ color: 0x00f2fe });
            const visor = new THREE.Mesh(visorGeo, visorMat);
            visor.position.set(0, 1.87, -0.15);
            playerGroup.add(visor);

            // Player Katana / Sword
            const bladeGeo = new THREE.BoxGeometry(0.04, 1.2, 0.08);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, metalness: 0.95, roughness: 0.05 });
            playerSword = new THREE.Mesh(bladeGeo, bladeMat);
            playerSword.position.set(0.4, 1.1, -0.4);
            playerSword.rotation.x = Math.PI / 4;
            playerSword.castShadow = true;
            playerGroup.add(playerSword);

            playerGroup.position.copy(player.position);
            scene.add(playerGroup);
        }

        function createEnemy() {
            if (enemyGroup) scene.remove(enemyGroup);

            enemyGroup = new THREE.Group();

            // Dark Knight Body
            const torsoGeo = new THREE.CylinderGeometry(0.45, 0.3, 1.3, 16);
            const enemyArmorMat = new THREE.MeshStandardMaterial({
                color: 0x4a0e17,
                metalness: 0.7,
                roughness: 0.3
            });
            const torso = new THREE.Mesh(torsoGeo, enemyArmorMat);
            torso.position.y = 1.2;
            torso.castShadow = true;
            enemyGroup.add(torso);

            // Enemy Helmet
            const headGeo = new THREE.SphereGeometry(0.24, 16, 16);
            const headMat = new THREE.MeshStandardMaterial({ color: 0x150507, metalness: 0.8, roughness: 0.2 });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.0;
            head.castShadow = true;
            enemyGrou
p.add(head);

            // Glowing Red Eyes
            const eyeGeo = new THREE.BoxGeometry(0.25, 0.04, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0844 });
            const eyes = new THREE.Mesh(eyeGeo, eyeMat);
            eyes.position.set(0, 2.02, 0.18);
            enemyGroup.add(eyes);

            // Enemy Heavy Greatsword
            const bladeGeo = new THREE.BoxGeometry(0.08, 1.5, 0.12);
            const bladeMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9, roughness: 0.2 });
            enemySword = new THREE.Mesh(bladeGeo, bladeMat);
            enemySword.position.set(-0.5, 1.2, 0.4);
            enemySword.rotation.x = -Math.PI / 4;
            enemySword.castShadow = true;
            enemyGroup.add(enemySword);

            enemyGroup.position.copy(enemy.position);
            scene.add(enemyGroup);
        }

        /* --- COMBAT MECHANICS & CONTROLS --- */
        function setupInput() {
            document.getElementById('btn-attack').addEventListener('click', () => triggerPlayerAttack('light'));
            document.getElementById('btn-heavy').addEventListener('click', () => triggerPlayerAttack('heavy'));
            document.getElementById('btn-parry').addEventListener('click', triggerParry);
            document.getElementById('btn-dodge').addEventListener('click', triggerDodge);

            // Touch / Drag Joystick Movement Simulation
            const movePad = document.getElementById('move-pad');
            let isDragging = false;
            let startX, startY;

            movePad.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || !gameActive) return;
                let dx = e.touches[0].clientX - startX;
                let dz = e.touches[0].clientY - startY;

                playerGroup.position.x = Math.max(-6, Math.min(6, playerGroup.position.x + dx * 0.005));
                playerGroup.position.z = Math.max(-2, Math.min(6, playerGroup.position.z + dz * 0.005));
                player.position.copy(playerGroup.position);

                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', () => isDragging = false);

            // Keyboard Support for Testing on PC
            window.addEventListener('keydown', (e) => {
                if (!gameActive) return;
                if (e.key === 'j' || e.key === 'J') triggerPlayerAttack('light');
                if (e.key === 'k' || e.key === 'K') triggerPlayerAttack('heavy');
                if (e.key === 'l' || e.key === 'L') triggerParry();
                if (e.key === ' ') triggerDodge();

                if (e.key === 'a' || e.key === 'ArrowLeft') playerGroup.position.x -= 0.3;
                if (e.key === 'd' || e.key === 'ArrowRight') playerGroup.position.x += 0.3;
                if (e.key === 'w' || e.key === 'ArrowUp') playerGroup.position.z -= 0.3;
                if (e.key === 's' || e.key === 'ArrowDown') playerGroup.position.z += 0.3;
            });
        }

        function triggerPlayerAttack(type) {
            if (!gameActive || player.isAttacking || player.isDodging) return;

            const cost = type === 'heavy' ? 30 : 15;
            if (player.stamina < cost) return;

            player.stamina -= cost;
            player.isAttacking = true;
            updateHUD();

            // Swing Animation
            let swingSpeed = type === 'heavy' ? 0.25 : 0.15;
            let damage = type === 'heavy' ? 35 : 18;

            let startRot = playerSword.rotation.z;
            let targetRot = startRot - Math.PI * 1.2;

            let animStep = 0;
            let interval = setInterval(() => {
                animStep += swingSpeed;
                playerSword.rotation.z = THREE.MathUtils.lerp(startRot, targetRot, animStep);

                if (animStep >= 1) {
                    clearInterval(interval);
                    playerSword.rotation.z = startRot;
                    player.isAttacking = false;

                    // Calculate Hit Check (Distance & Angle)
                    let dist = playerGroup.position.distanceTo(enemyGroup.position);
                    if (dist < 2.5) {
                        dealDamageToEnemy(damage);
                        spawnSparks(enemyGroup.position);
                        triggerCameraShake(0.15);
                    }
                }
            }, 20);
        }

        function triggerParry() {
            if (!gameActive || player.isParrying || player.isDodging) return;

            player.isParrying = true;
            playerSword.rotation.z = Math.PI / 2;
            playerSword.position.x = 0;

            showDamagePopup(playerGroup.position, "صدّ!", "#d4af37");

            setTimeout(() => {
                playerSword.rotation.z = 0;
                playerSword.position.x = 0.4;
                player.isParrying = false;
            }, 600);
        }

        function triggerDodge() {
            if (!gameActive || player.isDodging || player.dodgeCooldown) return;

            player.isDodging = true;
            player.dodgeCooldown = true;

            let dodgeDir = new THREE.Vector3(0, 0, 1.8);
            playerGroup.position.add(dodgeDir);

            showDamagePopup(playerGroup.position, "تفادي!", "#4facfe");

            setTimeout(() => player.isDodging = false, 400);
            setTimeout(() => player.dodgeCooldown = false, 1000);
        }

        /* --- ENEMY AI LOGIC --- */
        function updateEnemyAI(delta) {
            if (!gameActive || enemy.hp <= 0) return;

            // Face towards player
            enemyGroup.lookAt(playerGroup.position.x, enemyGroup.position.y, playerGroup.position.z);

            let dist = enemyGroup.position.distanceTo(playerGroup.position);

            if (dist > 2.0 && enemy.state !== 'attacking') {
                // Move towards player
                enemyGroup.translateZ(1.8 * delta);
            } else if (dist <= 2.2 && !enemy.isAttacking) {
                // Execute Enemy Attack Sequence
                executeEnemyAttack();
            }
        }

        function executeEnemyAttack() {
            enemy.isAttacking = true;
            enemy.state = 'attacking';

            // Telegraph attack (Wind up)
            enemySword.position.y = 1.8;

            setTimeout(() => {
                if (enemy.hp <= 0) return;

                // Slash Strike
                enemySword.position.y = 1.0;
                let dist = enemyGroup.position.distanceTo(playerGroup.position);

                if (dist < 2.3) {
                    if (player.isParrying) {
                        // Successful Parry! Stun Enemy
                        enemy.state = 'stunned';
                        spawnSparks(playerGroup.position);
                        triggerCameraShake(0.3);
                        showDamagePopup(enemyGroup.position, "كسر الدفاع! PARRIED", "#fff");
                        setTimeout(() => enemy.state = 'idle', 1500);
                    } else if (player.isDodging) {
                        showDamagePopup(playerGroup.position, "مراوغة!", "#4facfe");
                    } else {
                        // Player Gets Hit
                        dealDamageToPlayer(20);
                        triggerCameraShake(0.25);
                    }
                }

                setTimeout(() => {
                    enemySword.position.y = 1.2;
                    enemy.isAttacking = false;
                    enemy.state = 'idle';
                }, 500);
            }, 600);
        }

        /* --- DAMAGE & COMBAT CALCULATIONS --- */
        function dealDamageToEnemy(amount) {
            enemy.hp = Math.max(0, enemy.hp - amount);
            showDamagePopup(enemyGroup.position, `-${amount}`, "#ff0844");
            incrementCombo();
            updateHUD();

            if (enemy.hp <= 0) {
                enemyDefeated();
            }
        }

        function dealDamageToPlayer(amount) {
            player.hp = Math.max(0, player.hp - amount);
            showDamagePopup(playerGroup.position, `-${amount}`, "#ff0844");
            resetCombo();
            updateHUD();

            if (player.hp <= 0) {
                gameOver();
            }
        }

        function incrementCombo() {
            comboHits++;
            const comboContainer = document.getElementById('combo-container');
            const comboNum = document.getElementById('combo-num');
            comboContainer.style.opacity = '1';
            comboNum.innerText = comboHits;

            clearTimeout(comboTimeout);
            comboTimeout = setTimeout(() => {
                comboContainer.style.opacity = '0';
                comboHits = 0;
            }, 2000);
        }

        function resetCombo() {
            comboHits = 0;
            document.getElementById('combo-container').style.opacity = '0';
        }

        /* --- VISUAL EFFECTS --- */
        function spawnSparks(pos) {
            for (let i = 0; i < 15; i++) {
                const geo = new THREE.SphereGeometry(0.04, 8, 8);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffea00 });
                const p = new THREE.Mesh(geo, mat);
                p.position.copy(pos);
                p.position.y += 1.2;

                p.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 3 + 1,
                    (Math.random() - 0.5) * 4
                );
                scene.add(p);
                particles.push(p);
            }
        }

        function updateParticles(delta) {
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.position.addScaledVector(p.velocity, delta);
                p.scale.multiplyScalar(0.92);

                if (p.scale.x < 0.05) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }
        }

        function triggerCameraShake(intensity) {
            let origY = 3.5;
            let origX = 0;
            let duration = 200;
            let startTime = Date.now();

            let shakeInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                if (elapsed >= duration) {
                    camera.position.x = origX;
                    camera.position.y = origY;
                    clearInterval(shakeInterval);
                } else {
                    camera.position.x = origX + (Math.random() - 0.5) * intensity;
                    camera.position.y = origY + (Math.random() - 0.5) * intensity;
                }
            }, 16);
        }

        function showDamagePopup(worldPos, text, color) {
            const screenPos = worldPos.clone();
            screenPos.y += 1.8;
            screenPos.project(camera);

            const x = (screenPos.x * .5 + .5) * window.innerWidth;
            const y = (-(screenPos.y * .5) + .5) * window.innerHeight;

            const popup = document.createElement('div');
            popup.className = 'damage-popup';
            popup.innerText = text;
            popup.style.color = color;
            popup.style.left = `${x}px`;
            popup.style.top = `${y}px`;

            document.body.appendChild(popup);
            setTimeout(() => popup.remove(), 800);
        }

        /* --- HUD & GAME FLOW --- */
        function updateHUD() {
            document.getElementById('player-hp-bar').style.width = `${(player.hp / player.maxHp) * 100}%`;
            document.getElementById('player-hp-txt').innerText = `${player.hp}/${player.maxHp}`;
            document.getElementById('player-stamina-bar').style.width = `${(player.stamina / player.maxStamina) * 100}%`;

            document.getElementById('enemy-hp-bar').style.width = `${(enemy.hp / enemy.maxHp) * 100}%`;
            document.getElementById('enemy-hp-txt').innerText = `${enemy.hp}/${enemy.maxHp}`;
        }

        function enemyDefeated() {
            gameActive = false;
            currentStage++;

            setTimeout(() => {
                const modal = document.getElementById('game-modal');
                document.getElementById('modal-title').innerText = `انتصرت في المرحلة ${currentStage - 1}!`;
                document.getElementById('modal-desc').innerText = `استعد للمرحلة التالية. الخصوم سيزدادون سرعة وقوة.`;
                document.getElementById('modal-btn').innerText = `دخول المرحلة ${currentStage}`;
                modal.style.display = 'flex';
            }, 1000);
        }

        function gameOver() {
            gameActive = false;

            setTimeout(() => {
                const modal = document.getElementById('game-modal');
                document.getElementById('modal-title').innerText = `سقطت في المعركة!`;
                document.getElementById('modal-desc').innerText = `وصلت إلى المرحلة ${currentStage}. حاول استخدام الصد والتفادي بمهارة أكثر!`;
                document.getElementById('modal-btn').innerText = `إعادة المحاولة`;
                currentStage = 1;
                modal.style.display = 'flex';
            }, 1000);
        }

        function startGame() {
            document.getElementById('game-modal').style.display = 'none';

            // Reset States
            player.hp = player.maxHp;
            player.stamina = player.maxStamina;
            playerGroup.position.set(0, 0, 3);

            enemy.maxHp = 120 + (currentStage * 30);
            enemy.hp = enemy.maxHp;
            enemy.position.set(0, 0, -3);

            createEnemy();
            document.getElementById('stage-txt').innerText = `المرحلة ${currentStage}: حارس الظلام`;
            document.getElementById('enemy-title-txt').innerText = `حارس البرج (مستوى ${currentStage})`;

            updateHUD();
            gameActive = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        /* --- MAIN ANIMATION LOOP --- */
        function animate() {
            requestAnimationFrame(animate);
            let delta = clock.getDelta();

            // Regenerate Stamina
            if (player.stamina < player.maxStamina) {
                player.stamina = Math.min(player.maxStamina, player.stamina + 20 * delta);
                updateHUD();
            }

            // AI Logic
            updateEnemyAI(delta);

            // Particle Physics Update
            updateParticles(delta);

            renderer.render(scene, camera);
        }

        // Initialize on load
        window.onload = () => {
            init3D();
        };
    </script>
</body>
</html>
