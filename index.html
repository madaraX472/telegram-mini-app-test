<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MADARA CRYPTO</title>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #050b14, #0a1128, #1c2541);
    color: white;
    position: relative;
    overflow-x: hidden;
}

/* خلفية النجوم والقمر */
.moon {
    position: absolute;
    top: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: #fefcd7;
    box-shadow: 0 0 20px #fefcd7, 0 0 40px rgba(254, 252, 215, 0.4);
    z-index: 1;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
}

.app {
    max-width: 450px;
    margin: auto;
    padding: 20px;
    position: relative;
    z-index: 2;
}

.header {
    text-align: center;
    padding: 20px 0 10px;
}

.icon {
    font-size: 60px;
}

.title {
    font-size: 32px;
    font-weight: bold;
    color: #38bdf8;
    text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    letter-spacing: 1px;
}

.subtitle {
    color: #94a3b8;
    font-size: 14px;
}

.card {
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(10px);
    border: 1px solid #1e293b;
    border-radius: 25px;
    padding: 20px;
    margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.balance {
    background: linear-gradient(135deg, #38bdf8, #818cf8);
    color: #0f172a;
    text-align: center;
    border-radius: 22px;
    padding: 20px;
    font-weight: bold;
}

.balance h1 {
    font-size: 44px;
    margin: 5px 0;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.box {
    background: #020617;
    border-radius: 18px;
    padding: 15px;
    text-align: center;
    border: 1px solid #1e293b;
}

.box b {
    display: block;
    font-size: 24px;
    color: #38bdf8;
}

/* زر لعبة الضغط */
.tap-container {
    text-align: center;
}

.tap-btn {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0ea5e9, #6366f1);
    border: 4px solid #38bdf8;
    color: white;
    font-size: 36px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
    transition: transform 0.1s ease, box-shadow 0.1s ease;
    margin: 15px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
}

.tap-btn:active {
    transform: scale(0.92);
    box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
}

.counter-info {
    font-size: 16px;
    color: #cbd5e1;
    margin-top: 5px;
}

.counter-info span {
    color: #facc15;
    font-weight: bold;
}

button {
    width: 100%;
    border: 0;
    border-radius: 20px;
    padding: 15px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 10px;
    cursor: pointer;
}

.ads { background: #22c55e; color: white; }
.lock { background: #1e293b; color: #64748b; cursor: not-allowed; }
.invite { background: #f59e0b; color: white; }
.withdraw { background: #2563eb; color: white; }

.msg {
    display: none;
    background: #16a34a;
    color: white;
    padding: 12px;
    border-radius: 15px;
    text-align: center;
    margin-bottom: 15px;
}

.footer {
    text-align: center;
    color: #64748b;
    font-size: 13px;
}

.loading {
    opacity: 0.6;
    pointer-events: none;
}
</style>
</head>
<body>

<!-- عنصر القمر -->
<div class="moon"></div>

<!-- توليد النجوم بالخلفية -->
<script>
    for (let i = 0; i < 30; i++) {
        let star = document.createElement("div");
        star.className = "star";
        star.style.width = Math.random() * 3 + "px";
        star.style.height = star.style.width;
        star.style.top = Math.random() * 100 + "vh";
        star.style.left = Math.random() * 100 + "vw";
        star.style.animationDelay = Math.random() * 2 + "s";
        document.body.appendChild(star);
    }
</script>

<div class="app">
    <div class="header">
        <div class="icon">🌙</div>
        <div class="title">MADARA CRYPTO</div>
        <div class="subtitle">Tap to Earn & Watch Ads</div>
    </div>

    <div id="msg" class="msg"></div>

    <div class="card">
        <div class="balance">
            Current Balance
            <h1 id="points">0</h1>
            Points
        </div>
    </div>

    <div class="card">
        <div class="stats">
            <div class="box">
                <b id="ads">0</b> Ads Watched
            </div>
            <div class="box">
                <b id="level">1</b> Level
            </div>
        </div>
    </div>

    <!-- لعبة الضغط -->
    <div class="card tap-container">
        <h2>⚡ Tap & Earn</h2>
        <p>Tap 10 times to watch mandatory ad & gain reward!</p>
        <div class="tap-btn" id="tapBtn">👆</div>
        <div class="counter-info">
            Taps remaining: <span id="tapCount">10</span>/10
        </div>
    </div>

    <div class="card">
        <h2>🎬 Watch Ads Direct</h2>
        <button class="ads" id="manualAdBtn">🎥 Watch Ad (+10 Points)</button>
    </div>

    <div class="card">
        <button class="invite">👥 Invite Friends</button>
        <button class="withdraw">💸 Withdraw</button>
        <button class="lock">📋 Tasks (Soon)</button>
        <button class="lock">📊 Status (Soon)</button>
    </div>

    <div class="footer">
        MADARA CRYPTO © 2026
    </div>
</div>

<script>
let points = Number(localStorage.getItem("points")) || 0;
let ads = Number(localStorage.getItem("ads")) || 0;
let tapCounter = 0;
const MAX_TAPS = 10;

function update() {
    document.getElementById("points").innerHTML = points.toLocaleString();
    document.getElementById("ads").innerHTML = ads;
    document.getElementById("level").innerHTML = Math.floor(points / 100) + 1;
    
    localStorage.setItem("points", points);
    localStorage.setItem("ads", ads);
}

update();

function message(text) {
    let box = document.getElementById("msg");
    box.innerHTML = text;
    box.style.display = "block";
    
    setTimeout(() => {
        box.style.display = "none";
    }, 3000);
}

// تهيئة إعلانات Adsgram
const AdController = window.Adsgram.init({
    blockId: "40248"
});

// دالة عرض الإعلان
async function triggerAd() {
    try {
        message("⏳ Loading Mandatory Ad...");
        await AdController.show();
        points += 10;
        ads++;
        update();
        message("🎉 Success! +10 Points added.");
    } catch (e) {
        message("❌ No ad available right now.");
    }
}

// لعبة الضغط 10 ضغطات
const tapBtn = document.getElementById("tapBtn");
const tapCountDisplay = document.getElementById("tapCount");

tapBtn.onclick = async function() {
    tapCounter++;
    let remaining = MAX_TAPS - tapCounter;
    tapCountDisplay.innerHTML = remaining;

    if (tapCounter >= MAX_TAPS) {
        tapBtn.classList.add("loading");
        await triggerAd();
        // إعادة ضبط العداد
        tapCounter = 0;
        tapCountDisplay.innerHTML = MAX_TAPS;
        tapBtn.classList.remove("loading");
    }
};

// مشاهدة إعلان يدوي
document.getElementById("manualAdBtn").onclick = async function() {
    let btn = this;
    btn.classList.add("loading");
    await triggerAd();
    btn.classList.remove("loading");
};

// الأزرار الأخرى
document.querySelector(".invite").onclick = function() {
    message("👥 Invite system coming soon!");
};

document.querySelector(".withdraw").onclick = function() {
    message("💸 Withdrawal system coming soon!");
};
</script>
</body>
</html>
