<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Shadow Runner</title>

<style>

body{
margin:0;
background:#050816;
color:white;
font-family:Arial;
text-align:center;
overflow:hidden;
}


h2{
color:#38bdf8;
}


canvas{
background:#111827;
border-radius:20px;
display:block;
margin:auto;
box-shadow:0 0 30px #000;
}


button{

width:90%;
padding:15px;
margin:10px;

border:0;
border-radius:20px;

font-size:18px;
font-weight:bold;

background:#22c55e;
color:white;

}

</style>

</head>


<body>


<h2>🌃 Shadow Runner</h2>

<div>
النتيجة:
<span id="score">0</span>
</div>


<canvas id="game" width="360" height="600"></canvas>


<button onclick="startGame()">
▶ بدء اللعب
</button>



<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let running=false;

let score=0;

let roadMove=0;


let lane=1;


const lanes=[70,180,290];



let player={

x:180,

y:470,

width:35,

height:70,

run:0

};




// رسم المدينة

function drawCity(){


ctx.fillStyle="#020617";
ctx.fillRect(0,0,360,600);



for(let i=0;i<8;i++){

ctx.fillStyle="#1e293b";

ctx.fillRect(
i*60,
200-(i%3)*40,
40,
200
);


}


// أضواء

ctx.fillStyle="#38bdf8";

for(let i=0;i<15;i++){

ctx.fillRect(
Math.random()*360,
Math.random()*300,
4,
4
);


}

}



// رسم الطريق


function drawRoad(){


ctx.fillStyle="#334155";

ctx.fillRect(30,0,300,600);



ctx.strokeStyle="#94a3b8";

ctx.lineWidth=3;


for(let i=1;i<3;i++){

ctx.beginPath();

ctx.moveTo(30+i*100,0);

ctx.lineTo(30+i*100,600);

ctx.stroke();

}



roadMove+=8;


if(roadMove>60)
roadMove=0;



ctx.strokeStyle="#e2e8f0";

for(let y=-60;y<600;y+=60){

ctx.beginPath();

ctx.moveTo(130,y+roadMove);

ctx.lineTo(130,y+30+roadMove);

ctx.stroke();


ctx.beginPath();

ctx.moveTo(230,y+roadMove);

ctx.lineTo(230,y+30+roadMove);

ctx.stroke();


}



}



// شخصية عداء


function drawPlayer(){



player.run++;

let leg=
Math.sin(player.run*0.3)*8;



// الرأس

ctx.fillStyle="#f1c27d";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
15,
0,
Math.PI*2
);

ctx.fill();



// الجسم

ctx.fillStyle="#2563eb";

ctx.fillRect(
player.x-12,
player.y+15,
24,
35
);



// الأرجل المتحركة

ctx.strokeStyle="#111";

ctx.lineWidth=6;


ctx.beginPath();

ctx.moveTo(
player.x,
player.y+50
);

ctx.lineTo(
player.x-10,
player.y+65+leg
);

ctx.moveTo(
player.x,
player.y+50
);

ctx.lineTo(
player.x+10,
player.y+65-leg
);

ctx.stroke();



// اليد

ctx.beginPath();

ctx.moveTo(
player.x-10,
player.y+25
);

ctx.lineTo(
player.x-25,
player.y+40
);


ctx.moveTo(
player.x+10,
player.y+25
);

ctx.lineTo(
player.x+25,
player.y+40
);


ctx.stroke();


}




function update(){


if(!running)return;


ctx.clearRect(0,0,360,600);


drawCity();

drawRoad();

drawPlayer();



score++;

document.getElementById("score").innerHTML=
score;



requestAnimationFrame(update);


}





function startGame(){


running=true;

score=0;

lane=1;

player.x=lanes[lane];

update();


}





document.addEventListener("keydown",e=>{


if(e.key==="ArrowLeft" && lane>0){

lane--;

}


if(e.key==="ArrowRight" && lane<2){

lane++;

}


player.x=lanes[lane];


});



canvas.addEventListener("touchstart",e=>{


let x=e.touches[0].clientX;


if(x<180 && lane>0)
lane--;


if(x>180 && lane<2)
lane++;


player.x=lanes[lane];


});


// ===== الجزء الثاني =====


// العوائق

let obstacles=[];


// الطاقة

let energy=[];



function createObstacle(){

obstacles.push({

x:lanes[Math.floor(Math.random()*3)],

y:-80,

type:"box"

});


}



function createEnergy(){

energy.push({

x:lanes[Math.floor(Math.random()*3)],

y:-40

});


}





function drawObstacle(o){


ctx.fillStyle="#ef4444";


ctx.fillRect(

o.x-20,

o.y,

40,

45

);


// علامة تحذير

ctx.fillStyle="#111";

ctx.fillRect(

o.x-10,

o.y+10,

20,

10

);


}





function drawEnergy(e){


ctx.fillStyle="#22d3ee";


ctx.beginPath();

ctx.arc(

e.x,

e.y,

12,

0,

Math.PI*2

);

ctx.fill();


}




function checkCollision(a,b){


return (

Math.abs(a.x-b.x)<35 &&

Math.abs(a.y-b.y)<50

);


}






// تعديل التحديث القديم

let oldUpdate=update;



update=function(){


if(!running)return;


ctx.clearRect(0,0,360,600);


drawCity();

drawRoad();





// إنشاء عوائق

if(Math.random()<0.02){

createObstacle();

}



if(Math.random()<0.03){

createEnergy();

}




// العوائق

obstacles.forEach((o,index)=>{


o.y+=7;


drawObstacle(o);



if(checkCollision(player,o)){


gameOver();


}



if(o.y>650){

obstacles.splice(index,1);

}


});





// الطاقة

energy.forEach((e,index)=>{


e.y+=7;


drawEnergy(e);



if(checkCollision(player,e)){


score+=50;


document.getElementById("score").innerHTML=score;


energy.splice(index,1);


}



if(e.y>650){

energy.splice(index,1);

}


});



drawPlayer();



score++;


document.getElementById("score").innerHTML=score;



requestAnimationFrame(update);


};






function gameOver(){


running=false;


alert("💥 انتهت الجولة\nالنقاط: "+score);


}
</script>


</body>
</html>
