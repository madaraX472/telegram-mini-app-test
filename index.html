<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madara Crypto</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0713;
            --card-bg: rgba(255, 255, 255, 0.07);
            --primary-gold: #f3ba2f;
            --text-color: #ffffff;
            --text-sub: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at center top, #2d124d, #0b0713);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            user-select: none;
        }

        /* Top Header */
        .header {
            text-align: center;
            padding: 30px 20px 10px;
        }
        .header h1 {
            color: var(--primary-gold);
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 800;
        }
        .header p {
            color: var(--text-sub);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        /* Container for Pages */
        .container {
            padding: 20px;
            flex-grow: 1;
        }

        .page {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }
        .page.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Ad Card Style (Similar to Screenshot) */
        .ad-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .ad-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .ad-icon {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
        }
        .ad-details span {
            display: block;
        }
        .ad-title {
            font-weight: bold;
            font-size: 1rem;
        }
        .ad-reward {
            color: var(--primary-gold);
            font-size: 0.85rem;
            margin-top: 3px;
        }
        .watch-btn {
            background: linear-gradient(135deg, #fcd34d, #f59e0b);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .watch-btn:active {
            transform: scale(0.95);
        }

        /* Balance Dashboard */
        .balance-box {
            text-align: center;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }
        .balance-amount {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--primary-gold);
        }

        /* Form Inputs for Withdraw */
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-sub);
            font-size: 0.9rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            background: var(--primary-gold);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Bottom Navigation Bar */
        .nav-bar {
            background: rgba(11, 7, 19, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            position: sticky;
            bottom: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 0.75rem;
            cursor: pointer;
            gap: 4px;
        }
        .nav-item.active {
            color: var(--primary-gold);
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <div class="header">
        <h1>MADARA CRYPTO</h1>
        <p>WATCH ADS, EARN USDT — SIMPLE AS THAT.</p>
    </div>

    <!-- Main Content Pages -->
    <div class="container">
        
        <!-- PAGE 1: HOME -->
        <div id="homePage" class="page active">
            <div class="balance-box">
                <span style="color: var(--text-sub);">الرصيد الحالي</span>
                <div class="balance-amount"><span id="userBalance">0.000</span> USDT</div>
            </div>

            <!-- Adsterra Reward Card -->
            <div class="ad-card">
                <div class="ad-info">
                    <div class="ad-icon">▶</div>
                    <div class="ad-details">
                        <span class="ad-title">WATCH AN AD</span>
                        <span class="ad-reward">+$0.001 PER AD</span>
                    </div>
                </div>
                <button class="watch-btn" onclick="watchAdsterraAd()">▶ WATCH</button>
            </div>
        </div>

        <!-- PAGE 2: REFERRAL -->
        <div id="referralPage" class="page">
            <div class="balance-box">
                <h3>دعوة الأصدقاء</h3>
                <p style="color: var(--text-sub);">احصل على $0.005 لكل صديق يدخل عن طريق رابطك!</p>
                <div class="input-group">
                    <input type="text" id="refLink" readonly value="https://t.me/YourBotName?start=ref">
                </div>
                <button class="submit-btn" onclick="copyRefLink()">نسخ الرابط</button>
            </div>
        </div>

        <!-- PAGE 3: WITHDRAW -->
        <div id="withdrawPage" class="page">
            <div class="balance-box">
                <h3>طلب سحب الأرباح</h3>
                <p style="color: var(--text-sub); font-size: 0.8rem;">الحد الأدنى للسحب هو 0.5 USDT</p>
                
                <div class="input-group" style="text-align: right;">
                    <label>عنوان محفظة USDT (TRC20):</label>
                    <input type="text" id="walletAddress" placeholder="T...">
                </div>
                
                <div class="input-group" style="text-align: right;">
                    <label>المبلغ المراد سحبه:</label>
                    <input type="number" id="withdrawAmount" placeholder="0.5">
                </div>

                <button class="submit-btn" onclick="requestWithdrawal()">تأكيد طلب السحب</button>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar (Same as screenshot) -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('homePage', this)">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span>HOME</span>
        </div>
        <div class="nav-item" onclick="switchPage('referralPage', this)">
            <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
            <span>REFERRAL</span>
        </div>
        <div class="nav-item" onclick="switchPage('withdrawPage', this)">
            <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            <span>WITHDRAW</span>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // إعدادات البوت والإعلانات الخاصة بك
        const BOT_TOKEN = "8934745041:AAFnoIhabF440pZM17YDIektjN9XFuZ4u1Y";
        const ADMIN_CHAT_ID = "5557254074";
        const ADSTERRA_URL = "https://www.effectivecpmnetwork.com/a1vfkyh00?key=0a2e384c7e26526ab5a723803a4254e2";

        // تهيئة Telegram WebApp
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        // تحميل وتحديث الرصيد المخزن
        let balance = parseFloat(localStorage.getItem('madara_balance') || '0.000');
        document.getElementById('userBalance').innerText = balance.toFixed(3);

        // التنقل بين الصفحات
        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            element.classList.add('active');
        }

        // تشغيل إعلان Adsterra
        function watchAdsterraAd() {
            // 1. فتح رابط Adsterra المباشر
            if (tg) {
                tg.openLink(ADSTERRA_URL);
            } else {
                window.open(ADSTERRA_URL, '_blank');
            }

            // 2. إعطاء المكافأة فورية ($0.001)
            balance += 0.001;
            localStorage.setItem('madara_balance', balance.toString());
            document.getElementById('userBalance').innerText = balance.toFixed(3);

            alert("🎉 تم تشغيل الإعلان وإضافة $0.001 إلى رصيدك!");
        }

        // نسخ رابط الدعوة
        function copyRefLink() {
            const userId = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456';
            const link = `https://t.me/MadaraCryptoBot?start=${userId}`;
            navigator.clipboard.writeText(link);
            alert("تم نسخ رابط الدعوة بنجاح!");
        }

        // طلب السحب وإرسال إشعار للبوت
        function requestWithdrawal() {
            const wallet = document.getElementById('walletAddress').value.trim();
            const amount = parseFloat(document.getElementById('withdrawAmount').value);

            if (!wallet) {
                alert("يرجى أدخال عنوان المحفظة!");
                return;
            }

            if (isNaN(amount) || amount < 0.5) {
                alert("الحد الأدنى للسحب هو 0.5 USDT!");
                return;
            }

            if (amount > balance) {
                alert("رصيدك الحالي غير كافٍ للسحب!");
                return;
            }

            // خصم الرصيد
            balance -= amount;
            localStorage.setItem('madara_balance', balance.toString());
            document.getElementById('userBalance').innerText = balance.toFixed(3);

            // بيانات المستخدم في التليجرام
            const user = tg && tg.initDataUnsafe ? tg.initDataUnsafe.user : null;
            const username = user ? (user.username ? `@${user.username}` : user.first_name) : "مستخدم تجريبي";
            const userId = user ? user.id : "غير معروف";

            // نص الرسالة الموجهة للادمن
            const message = `🚨 *طلب سحب جديد في Madara Crypto* 🚨\n\n` +
                            `👤 *المستخدم:* ${username} (ID: \`${userId}\`)\n` +
                            `💰 *المبلغ:* ${amount} USDT\n` +
                            `🏦 *المحفظة:* \`${wallet}\``;

            // إرسال الرسالة إلى البوت
            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    chat_id: ADMIN_CHAT_ID,
                    text: message,
                    parse_mode: "Markdown"
                })
            })
            .then(res => res.json())
            .then(data => {
                if(data.ok) {
                    alert("✅ تم تقديم طلب السحب بنجاح! سيتم فحص الطلب وإرسال الأرباح.");
                } else {
                    alert("حدث خطأ أثناء إرسال الطلب، يرجى المحاولة لاحقاً.");
                }
            })
            .catch(() => alert("خطأ في الاتصال بالخادم."));
        }
    </script>
</body>
</html>
