<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel USDT - Dark Knight Arena</title>
    <!-- استدعاء مكتبة Three.js المضمونة -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        /* HUD Top Bar */
        .hud {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 10;
        }
        .health-card {
            background: rgba(15, 15, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 8px 12px;
            width: 45%;
            backdrop-filter: blur(5px);
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }
        .bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .bar-fill {
            height: 100%;
            transition: width 0.2s ease-in-out;
        }
        #player-hp-bar { background: linear-gradient(90deg, #00d2ff, #3a7bd5); }
        #player-stamina-bar { background: linear-gradient(90deg, #f7971e, #ffd200); height: 6px; }
        #enemy-hp-bar { background: linear-gradient(90deg, #ff0844, #ffb199); }

        /* Controls UI */
        .controls-container {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            z-index: 10;
            pointer-events: none;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            pointer-events: auto;
        }
        .btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn:active { transform: scale(0.92); }
        #btn-attack { background: radial-gradient(circle, #8a0b0b, #4a0000); }
        #btn-heavy { background: radial-gradient(circle, #6a0d8a, #2c003e); }
        #btn-parry { background: radial-gradient(circle, #8a730b, #4a3c00); }
        #btn-dodge { background: radial-gradient(circle, #0b618a, #002d4a); }

        /* Joystick Area */
        .joystick-zone {
            width: 110px;
            height: 110px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            pointer-events: auto;
            backdrop-filter: blur(4px);
        }

        /* Damage Popups & Modal */
        .damage-popup {
            position: absolute;
            font-weight: 900;
            font-size: 22px;
            pointer-events: none;
            animation: popupAnim 0.8s forwards;
            z-index: 100;
            text-shadow: 0 0 5px #000;
        }
        @keyframes popupAnim {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }

        #game-modal {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: white;
        }
        #modal-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: linear-gradient(90deg, #ff0844, #ffb199);
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- HUD Top -->
    <div class="hud">
        <div class="health-card">
            <div class="card-header">
                <span>مادارا</span>
                <span id="player-hp-txt">100/100</span>
            </div>
            <div class="bar-bg"><div id="player-hp-bar" class="bar-fill" style="width: 100%;"></div></div>
            <div class="bar-bg" style="height: 6px;"><div id="player-stamina-bar" class="bar-fill" style="width: 100%;"></div></div>
        </div>

        <div class="health-card">
            <div class="card-header">
                <span id="enemy-title-txt">حارس البرج</span>
                <span id="enemy-hp-txt">150/150</span>
            </div>
            <div class="bar-bg"><div id="enemy-hp-bar" class="bar-fill" style="width: 100%;"></div></div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="game-container"></div>

    <!-- Control Buttons -->
    <div class="controls-container">
        <div class="action-grid">
            <div id="btn-attack" class="btn">⚔️<br>هجوم</div>
            <div id="btn-parry" class="btn">🛡️<br>صد</div>
            <div id="btn-dodge" class="btn">💨<br>تفادي</div>
            <div id="btn-heavy" class="btn">🔥<br>قاطعة</div>
        </div>
        <div id="move-pad" class="joystick-zone">اسحب للتحرك<br>Move</div>
    </div>

    <!-- Start/Restart Modal -->
    <div id="game-modal">
        <h1 id="modal-title">Dark Knight Arena</h1>
        <p id="modal-desc" style="margin-top:10px; color:#aaa;">جاهز للمواجهة؟</p>
        <button id="modal-btn" onclick="startGame()">ابدأ القتال</button>
    </div>

    <script>
        let scene, camera, renderer, clock;
        let playerGroup, playerSword, enemyGroup, enemySword;
        let gameActive = false, currentStage = 1;

        let player = { hp: 100, maxHp: 100, stamina: 100, maxStamina: 100, isAttacking: false, isParrying: false, isDodging: false };
        let enemy = { hp: 150, maxHp: 150, isAttacking: false, state: 'idle' };

        function init3D() {
            const container = document.getElementById('game-container');
            
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0a0a12);
            scene.fog = new THREE.FogExp2(0x0a0a12, 0.05);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 3.5, 6.5);
            camera.lookAt(0, 1, 0);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // Floor
            const floorGeo = new THREE.PlaneGeometry(30, 30);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x1a1a24, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // Create Entities
            createPlayer();
            createEnemy();
            setupControls();

            window.addEventListener('resize', onWindowResize);
            
            // Animation Loop
            animate();
        }

        function createPlayer() {
            playerGroup = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.3, 0.3, 1.4, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x3a7bd5 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.7;
            playerGroup.add(body);

            // Sword
            const swordGeo = new THREE.BoxGeometry(0.06, 1.2, 0.1);
            const swordMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.8 });
            playerSword = new THREE.Mesh(swordGeo, swordMat);
            playerSword.position.set(0.4, 0.8, -0.3);
            playerGroup.add(playerSword);

            playerGroup.position.set(0, 0, 2);
            scene.add(playerGroup);
        }

        function createEnemy() {
            if (enemyGroup) scene.remove(enemyGroup);
            enemyGroup = new THREE.Group();

            // Body
            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 16);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a0e17, metalness: 0.7 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            enemyGroup.add(body);

            // Eyes
            const eyeGeo = new THREE.BoxGeometry(0.3, 0.05, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0844 });
            const eyes = new THREE.Mesh(eyeGeo, eyeMat);
            eyes.position.set(0, 1.3, -0.38);
            enemyGroup.add(eyes);

            // Weapon
            const swordGeo = new THREE.BoxGeometry(0.08, 1.5, 0.12);
            const swordMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9 });
            enemySword = new THREE.Mesh(swordGeo, swordMat);
            enemySword.position.set(-0.5, 0.9, -0.3);
            enemyGroup.add(enemySword);

            enemyGroup.position.set(0, 0, -2);
            scene.add(enemyGroup);
        }

        function setupControls() {
            document.getElementById('btn-attack').onclick = () => attack('light');
            document.getElementById('btn-heavy').onclick = () => attack('heavy');
            document.getElementById('btn-parry').onclick = parry;
            document.getElementById('btn-dodge').onclick = dodge;

            // Touch Movement (Joystick Drag)
            let movePad = document.getElementById('move-pad');
            let isDragging = false, startX, startY;

            movePad.addEventListener('touchstart', (e) => {
                isDragging = true;
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchmove', (e) => {
                if (!isDragging || !gameActive) return;
                let dx = (e.touches[0].clientX - startX) * 0.01;
                let dz = (e.touches[0].clientY - startY) * 0.01;

                playerGroup.position.x = Math.max(-4, Math.min(4, playerGroup.position.x + dx));
                playerGroup.position.z = Math.max(-1, Math.min(4, playerGroup.position.z + dz));

                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', () => isDragging = false);
        }

        function attack(type) {
            if (!gameActive || player.isAttacking) return;
            let cost = type === 'heavy' ? 30 : 15;
            if (player.stamina < cost) return;

            player.stamina -= cost;
            player.isAttacking = true;
            updateHUD();

            // Quick Sword Animation
            let origRot = playerSword.rotation.x;
            playerSword.rotation.x = -Math.PI / 2;

            setTimeout(() => {
                playerSword.rotation.x = origRot;
                player.isAttacking = false;

                // Hit Check
                if (playerGroup.position.distanceTo(enemyGroup.position) < 2.2) {
                    let dmg = type === 'heavy' ? 35 : 18;
                    enemy.hp = Math.max(0, enemy.hp - dmg);
                    showPopup(`-${dmg}`, '#ff0844', enemyGroup.position);
                    updateHUD();

                    if (enemy.hp <= 0) win();
                }
            }, 250);
        }

        function parry() {
            if (!gameActive || player.isParrying) return;
            player.isParrying = true;
            showPopup("صد!", "#ffd200", playerGroup.position);
            setTimeout(() => player.isParrying = false, 600);
        }

        function dodge() {
            if (!gameActive || player.isDodging) return;
            player.isDodging = true;
            playerGroup.position.z += 1.2;
            showPopup("تفادي!", "#00d2ff", playerGroup.position);
            setTimeout(() => player.isDodging = false, 500);
        }

        function updateHUD() {
            document.getElementById('player-hp-bar').style.width = (player.hp / player.maxHp * 100) + '%';
            document.getElementById('player-hp-txt').innerText = `${player.hp}/${player.maxHp}`;
            document.getElementById('player-stamina-bar').style.width = (player.stamina / player.maxStamina * 100) + '%';

            document.getElementById('enemy-hp-bar').style.width = (enemy.hp / enemy.maxHp * 100) + '%';
            document.getElementById('enemy-hp-txt').innerText = `${enemy.hp}/${enemy.maxHp}`;
        }

        function showPopup(text, color, pos) {
            let el = document.createElement('div');
            el.className = 'damage-popup';
            el.innerText = text;
            el.style.color = color;
            el.style.left = (window.innerWidth / 2) + 'px';
            el.style.top = (window.innerHeight / 2) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        function startGame() {
            document.getElementById('game-modal').style.style = 'none';
            document.getElementById('game-modal').style.display = 'none';
            player.hp = 100; player.stamina = 100;
            enemy.hp = enemy.maxHp;
            updateHUD();
            gameActive = true;
        }

        function win() {
            gameActive = false;
            alert("انتصرت في المعركة!");
            document.getElementById('game-modal').style.display = 'flex';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameActive) {
                // Regenerate Stamina
                if (player.stamina < player.maxStamina) {
                    player.stamina = Math.min(player.maxStamina, player.stamina + 0.3);
                    updateHUD();
                }

                // AI Simple Move
                let dist = enemyGroup.position.distanceTo(playerGroup.position);
                if (dist > 1.8) {
                    enemyGroup.position.z += 0.015;
                }
            }

            renderer.render(scene, camera);
        }

        // Start 3D Engine on load
        window.onload = init3D;
    </script>
</body>
</html>
