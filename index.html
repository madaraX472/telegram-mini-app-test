<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA EARN</title>

    <!-- خط Cairo لمظهر احترافي -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>

    <style>
        :root {
            --bg-main: #090d16;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #facc15;
            --secondary-accent: #f97316;
            --green-btn: linear-gradient(135deg, #10b981, #059669);
            --orange-btn: linear-gradient(135deg, #f59e0b, #d97706);
            --blue-btn: linear-gradient(135deg, #3b82f6, #2563eb);
            --lock-btn: rgba(255, 255, 255, 0.05);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(250, 204, 21, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(37, 99, 235, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        .app {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* الهيدر */
        .header {
            text-align: center;
            padding: 10px 0 5px;
        }

        .icon {
            font-size: 50px;
            filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 30%, var(--primary-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: var(--text-sub);
            font-size: 13px;
            font-weight: 600;
        }

        /* التنبيهات */
        .msg {
            display: none;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34d399;
            padding: 12px;
            border-radius: 14px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            backdrop-filter: blur(8px);
            animation: fadeIn 0.3s ease;
        }

        .msg.error {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.4);
            color: #f87171;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* الكروت General Card */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* كارت الرصيد */
        .balance-card {
            background: linear-gradient(135deg, #facc15 0%, #ea580c 100%);
            border: none;
            color: #000;
            text-align: center;
            padding: 22px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(234, 88, 12, 0.3);
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            pointer-events: none;
        }

        .balance-title {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.85;
            text-transform: uppercase;
        }

        .balance-amount {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.1;
            margin: 6px 0;
        }

        .balance-unit {
            font-size: 13px;
            font-weight: 700;
            opacity: 0.9;
        }

        /* كارت الإحصائيات */
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 14px;
            padding: 12px;
            text-align: center;
        }

        .box span {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 2px;
        }

        .box b {
            font-size: 20px;
            color: var(--primary-accent);
        }

        /* عنوان القسم */
        .section-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-desc {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 14px;
        }

        /* الأزرار */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-ads {
            background: var(--green-btn);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.25);
        }

        .btn-invite {
            background: var(--orange-btn);
        }

        .btn-withdraw {
            background: var(--blue-btn);
        }

        .btn-lock {
            background: var(--lock-btn);
            color: #64748b;
            border: 1px dashed rgba(255, 255, 255, 0.1);
            cursor: not-allowed;
            justify-content: space-between;
        }

        .btn-lock span {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 8px;
            border-radius: 20px;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* الفوتر */
        .footer {
            text-align: center;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="app">

        <div class="header">
            <div class="icon">🌌</div>
            <div class="title">NOVA EARN</div>
            <div class="subtitle">منصة الربح الذكية من الإعلانات</div>
        </div>

        <div id="msg" class="msg"></div>

        <div class="card balance-card">
            <div class="balance-title">الرصيد الحالي</div>
            <div class="balance-amount" id="points">0</div>
            <div class="balance-unit">نقطة</div>
        </div>

        <div class="card">
            <div class="stats">
                <div class="box">
                    <span>الإعلانات المشاهدة</span>
                    <b id="ads">0</b>
                </div>
                <div class="box">
                    <span>المستوى الحالي</span>
                    <b id="level">1</b>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="section-title">🎬 مشاهدة الإعلانات</div>
            <div class="section-desc">شاهد الإعلانات اليومية واجمع النقاط فوراً</div>
            <button class="btn-ads" id="adBtn">
                <span>🎥</span> مشاهدة إعلان (+10 نقاط)
            </button>
        </div>

        <div class="card">
            <div class="btn-group">
                <button class="btn-invite" id="inviteBtn">
                    👥 دعوة الأصدقاء
                </button>

                <button class="btn-withdraw" id="withdrawBtn">
                    💸 سحب الأرباح
                </button>

                <button class="btn-lock" disabled>
                    <span>📋 المهام اليومية</span>
                    <span>قريباً</span>
                </button>

                <button class="btn-lock" disabled>
                    <span>📊 الإحصائيات الشاملة</span>
                    <span>قريباً</span>
                </button>
            </div>
        </div>

        <div class="footer">
            NOVA EARN &copy; 2026 • جميع الحقوق محفوظة
        </div>

    </div>

    <script>
        // استرجاع البيانات
        let points = Number(localStorage.getItem("points")) || 0;
        let ads = Number(localStorage.getItem("ads")) || 0;

        // تحديث الواجهة
        function updateUI() {
            document.getElementById("points").innerText = points.toLocaleString();
            document.getElementById("ads").innerText = ads.toLocaleString();
            document.getElementById("level").innerText = Math.floor(points / 100) + 1;

            localStorage.setItem("points", points);
            localStorage.setItem("ads", ads);
        }

        updateUI();

        // إظهار التنبيهات
        function showMessage(text, isError = false) {
            const box = document.getElementById("msg");
            box.innerText = text;
            
            if (isError) {
                box.classList.add("error");
            } else {
                box.classList.remove("error");
            }

            box.style.display = "block";

            setTimeout(() => {
                box.style.display = "none";
            }, 3000);
        }

        // إعداد الإعلانات
        const AdController = window.Adsgram ? window.Adsgram.init({ blockId: "40248" }) : null;

        // مشاهدة الإعلان
        document.getElementById("adBtn").onclick = async function () {
            const btn = this;
            btn.classList.add("loading");
            btn.innerHTML = "⏳ جاري تحضير الإعلان...";

            setTimeout(async () => {
                try {
                    if (AdController) {
                        await AdController.show();
                    }
                    points += 10;
                    ads++;
                    updateUI();
                    showMessage("🎉 مبروك! حصلت على 10 نقاط");
                } catch (e) {
                    showMessage("❌ لا يوجد إعلان متاح حالياً، حاول لاحقاً", true);
                } finally {
                    btn.classList.remove("loading");
                    btn.innerHTML = "<span>🎥</span> مشاهدة إعلان (+10 نقاط)";
                }
            }, 2000);
        };

        // الأزرار التفاعلية
        document.getElementById("inviteBtn").onclick = () => {
            showMessage("👥 نظام الدعوات يتاح قريباً!");
        };

        document.getElementById("withdrawBtn").onclick = () => {
            showMessage("💸 نظام السحب سيتم تفعيله قريباً!");
        };
    </script>

</body>

</html>
