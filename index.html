<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>NOVA EARN</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
font-family:Cairo,Arial;
}


body{

margin:0;
background:
linear-gradient(180deg,#050505,#111827);

color:white;
min-height:100vh;

}


.app{

max-width:450px;
margin:auto;
padding:15px;

}



.banner{

width:100%;
height:160px;
border-radius:25px;
object-fit:cover;
box-shadow:0 0 30px #000;

}



.logo{

text-align:center;
margin-top:-45px;

}



.logo img{

width:90px;
height:90px;
border-radius:50%;
border:5px solid #111827;

}



.title{

text-align:center;
font-size:32px;
font-weight:900;
color:#facc15;

}


.subtitle{

text-align:center;
color:#aaa;
margin-bottom:20px;

}



.card{

background:
rgba(255,255,255,.05);

border:1px solid #333;

border-radius:25px;

padding:20px;

margin-bottom:15px;

backdrop-filter:blur(10px);

}



.balance{

text-align:center;

background:
linear-gradient(135deg,#facc15,#ea580c);

color:#111;

padding:25px;

border-radius:25px;

}



.balance h1{

font-size:50px;
margin:5px;

}



.stats{

display:grid;

grid-template-columns:1fr 1fr;

gap:12px;

}



.stat{

background:#09090b;

padding:15px;

border-radius:20px;

text-align:center;

}



.stat b{

font-size:26px;

display:block;

color:#facc15;

}



.progress{

height:12px;

background:#333;

border-radius:20px;

overflow:hidden;

}



.bar{

height:100%;

background:#22c55e;

width:40%;

}



button{

width:100%;

padding:16px;

border:0;

border-radius:20px;

font-size:18px;

font-weight:bold;

margin-top:12px;

}



.ads{

background:#22c55e;
color:white;

}



.withdraw{

background:#2563eb;
color:white;

}



.invite{

background:#f59e0b;
color:#111;

}



.loading{

opacity:.6;

}



.notice{

display:none;

background:#22c55e;

padding:12px;

border-radius:15px;

text-align:center;

margin-bottom:15px;

}



.footer{

text-align:center;
color:#777;
font-size:13px;

}


</style>

</head>


<body>


<div class="app">


<img class="banner" src="images/banner.png">


<div class="logo">

<img src="images/logo.png">

</div>


<h1 class="title">
NOVA EARN
</h1>


<div class="subtitle">
اكسب النقاط من مشاهدة الإعلانات 🎁
</div>


<div class="notice" id="notice"></div>



<div class="card">

<div class="balance">

رصيدك

<h1 id="points">0</h1>

نقطة

</div>

</div>




<div class="card">

<div class="stats">

<div class="stat">

<b id="adsCount">0</b>

إعلانات

</div>


<div class="stat">

<b id="level">1</b>

المستوى

</div>


</div>


<br>


<div class="progress">

<div class="bar" id="bar"></div>

</div>


</div>





<div class="card">


<h2>
🎬 AdsGram
</h2>


<p>
شاهد الإعلانات واحصل على نقاط مجانية
</p>


<button class="ads">

🎥 مشاهدة إعلان +10

</button>


</div>





<div class="card">


<button class="invite">

👥 دعوة الأصدقاء

</button>


<button class="withdraw">

💸 سحب الأرباح

</button>


</div>



<div class="footer">

NOVA EARN © 2026

</div>



</div>



<script>


let points =
Number(localStorage.getItem("points")) || 0;


let ads =
Number(localStorage.getItem("ads")) || 0;



function save(){

localStorage.setItem("points",points);

localStorage.setItem("ads",ads);

}



function show(msg){

let n=document.getElementById("notice");

n.innerHTML=msg;

n.style.display="block";


setTimeout(()=>{

n.style.display="none";

},3000);


}



function update(){


document.getElementById("points").innerHTML =
points.toLocaleString();


document.getElementById("adsCount").innerHTML =
ads;


let lvl=Math.floor(points/100)+1;


document.getElementById("level").innerHTML=lvl;


let percent=(points%100);


document.getElementById("bar").style.width=
percent+"%";


save();


}


update();



const AdController =
window.Adsgram.init({

blockId:"40248"

});





document.querySelector(".ads").onclick=async function(){


let btn=this;


btn.classList.add("loading");

btn.innerHTML="⏳ جاري تحميل الإعلان";


try{


await AdController.show();


points+=10;

ads++;


update();


show("🎉 حصلت على +10 نقاط");


}

catch(e){

show("❌ لا يوجد إعلان حاليا");

}



btn.classList.remove("loading");

btn.innerHTML="🎥 مشاهدة إعلان +10";


};







document.querySelector(".invite").onclick=function(){


let link=
"https://t.me/test_rewards_libya_bot";


navigator.clipboard.writeText(link);


show("✅ تم نسخ رابط الدعوة");


};







document.querySelector(".withdraw").onclick=function(){


if(points<1000){

show("⚠️ تحتاج 1000 نقطة للسحب");

return;

}


show("💸 تم إرسال طلب السحب للمراجعة");


};








if(window.Telegram &&
Telegram.WebApp){


Telegram.WebApp.ready();


let user=
Telegram.WebApp.initDataUnsafe.user;


if(user){

document.querySelector(".subtitle").innerHTML=

"مرحبا "+user.first_name+" 👋";

}


}



</script>


</body>

</html>
