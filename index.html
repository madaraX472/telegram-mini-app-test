<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Madara Crypto - Pixel Edition</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tajawal:wght@700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; user-select: none; }
    
    body { 
      background-color: #050814; 
      color: #fff; 
      min-height: 100vh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      overflow-x: hidden; 
    }
    
    /* خلفية الفارس والغابة الفانتازية */
    .bg-knight { 
      position: fixed; 
      top: 0; left: 0; width: 100%; height: 100%; 
      background: url('https://i.ibb.co/6R2qg5j/pixel-knight-forest.jpg') center center / cover no-repeat;
      z-index: -2; 
      image-rendering: pixelated;
    }

    /* طبقة تعتيم خفيفة لإبراز الواجهة */
    .bg-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 12, 10, 0.45);
      backdrop-filter: blur(2px);
      z-index: -1;
    }

    .app-container { 
      width: 100%; 
      max-width: 450px; 
      min-height: 100vh; 
      padding: 15px 16px 85px 16px; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between;
      position: relative; 
    }

    /* الهيدر */
    .app-header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 10px 14px;
      background: rgba(10, 25, 18, 0.75);
      border: 3px solid #2d6a4f;
      box-shadow: 0 4px 0 #1b4332, inset 0 0 10px rgba(82, 183, 136, 0.2);
    }
    
    .pixel-title { 
      font-family: 'Press Start 2P', cursive; 
      font-size: 11px; 
      color: #52b788; 
      text-shadow: 2px 2px #000; 
    }
    
    .user-pill { 
      background: #1b4332; 
      border: 2px solid #52b788; 
      padding: 4px 10px; 
      font-size: 11px; 
      display: flex; 
      align-items: center; 
      gap: 6px; 
      font-weight: bold;
    }
    .status-dot { width: 8px; height: 8px; background: #74c69d; box-shadow: 0 0 6px #74c69d; }

    .page { display: none; animation: fadeIn 0.25s ease-in-out; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    /* بطاقات البكسل احترافية */
    .pixel-box {
      background: rgba(15, 30, 22, 0.85);
      border: 3px solid #40916c;
      box-shadow: 4px 4px 0px #081c15, inset 0 0 12px rgba(82, 183, 136, 0.15);
      padding: 16px;
      margin-bottom: 15px;
      text-align: center;
    }

    .card-label { font-size: 12px; color: #b7e4c7; font-weight: bold; }
    .balance-value { 
      font-size: 30px; 
      font-weight: 900; 
      color: #74c69d; 
      margin: 8px 0; 
      font-family: 'Press Start 2P', cursive; 
      text-shadow: 3px 3px #081c15; 
    }
    .pixel-badge { 
      display: inline-block; 
      background: #081c15; 
      color: #d8f3dc; 
      font-size: 10px; 
      padding: 4px 10px; 
      border: 1px solid #52b788; 
      font-family: 'Press Start 2P', cursive;
    }

    /* أزرار Pixel الاحترافية */
    .pixel-btn {
      display: block;
      width: 100%;
      border: 3px solid #000;
      padding: 12px;
      font-size: 14px;
      font-weight: 900;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      position: relative;
      transition: all 0.1s;
    }

    .btn-ad {
      background: #74c69d;
      color: #081c15;
      box-shadow: 0 5px 0 #2d6a4f, 0 8px 0 #000;
    }

    .btn-ad:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #2d6a4f, 0 4px 0 #000;
    }

    .btn-ad:disabled {
      background: #40916c;
      color: #b7e4c7;
      opacity: 0.7;
      cursor: not-allowed;
      box-shadow: 0 2px 0 #1b4332, 0 4px 0 #000;
    }

    .btn-task {
      background: #48cae4;
      color: #03045e;
      box-shadow: 0 5px 0 #0077b6, 0 8px 0 #000;
    }
    .btn-task:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #0077b6, 0 4px 0 #000;
    }

    .btn-withdraw {
      background: #52b788;
      color: #081c15;
      box-shadow: 0 5px 0 #1b4332, 0 8px 0 #000;
    }

    .timer-text {
      font-family: 'Press Start 2P', cursive;
      font-size: 11px;
      color: #ffddd2;
      margin-top: 8px;
    }

    /* صفحة المهام والسحب */
    .task-card {
      background: rgba(10, 25, 18, 0.9);
      border: 2px solid #52b788;
      padding: 14px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-header { display: flex; justify-content: space-between; align-items: center; }
    .task-title { font-size: 14px; color: #fff; font-weight: bold; }
    .task-reward { font-size: 12px; color: #74c69d; font-family: 'Press Start 2P', cursive; }

    .pixel-input {
      width: 100%;
      background: #081c15;
      border: 2px solid #52b788;
      padding: 10px;
      color: #fff;
      font-size: 12px;
      outline: none;
      margin: 8px 0 14px 0;
    }

    /* الشريط السفلي */
    .bottom-nav { 
      position: fixed; 
      bottom: 0; left: 0; right: 0; 
      max-width: 450px; 
      margin: 0 auto; 
      background: rgba(8, 28, 21, 0.95); 
      border-top: 3px solid #40916c; 
      display: flex; 
      justify-content: space-around; 
      padding: 8px 0; 
    }
    
    .nav-item { 
      background: none; 
      border: none; 
      color: #74c69d; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 4px; 
      font-size: 11px; 
      font-weight: bold;
      cursor: pointer; 
    }
    .nav-item.active { color: #d8f3dc; text-shadow: 0 0 5px #74c69d; }
    .nav-icon { font-size: 18px; }

    .toast { 
      position: fixed; 
      bottom: 75px; left: 50%; 
      transform: translateX(-50%); 
      background: #081c15; 
      color: #d8f3dc; 
      padding: 10px 18px; 
      border: 2px solid #74c69d; 
      font-size: 12px; 
      display: none; 
      z-index: 1000; 
      box-shadow: 0 4px 0 #000;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- صورة الفارس والغابة -->
  <div class="bg-knight"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="pixel-title">⚔️ MADARA CRYPTO</div>
      <div class="user-pill">
        <span class="status-dot"></span>
        <span id="user-display-name">فارس البكسل</span>
      </div>
    </header>

    <!-- الصفحة الرئيسية -->
    <main id="page-home" class="page active">
      <div class="pixel-box">
        <span class="card-label">الرصيد الحالي (USDT)</span>
        <div class="balance-value" id="user-balance">0.0000</div>
        <div class="pixel-badge">BEP20 NETWORK</div>
      </div>

      <!-- منطقة الإعلانات في الرئيسية -->
      <div class="pixel-box" style="margin-top: 20px;">
        <h3 style="font-size: 14px; color: #d8f3dc; margin-bottom: 10px;">📺 إعلان Adsgram اليومي</h3>
        <p style="font-size: 12px; color: #b7e4c7; margin-bottom: 12px;">شاهد الإعلان كل 30 دقيقة واحصل على <b>+0.005$</b></p>
        
        <button id="ad-btn" class="pixel-btn btn-ad" onclick="watchAd()">
          🎬 مشاهدة الإعلان (+0.005$)
        </button>
        <div id="timer-display" class="timer-text" style="display: none;"></div>
      </div>
    </main>

    <!-- صفحة المهام -->
    <main id="page-tasks" class="page">
      <h2 style="font-size: 15px; color: #d8f3dc; margin-bottom: 12px; text-shadow: 2px 2px #000;">⚔️ مهام البكسل</h2>
      
      <div class="task-card">
        <div class="task-header">
          <span class="task-title">📢 اشترك في قناة التلجرام</span>
          <span class="task-reward">+0.004$</span>
        </div>
        <button id="channel-task-btn" class="pixel-btn btn-task" onclick="doChannelTask()">
          انضمام للقناة 🚀
        </button>
      </div>
    </main>

    <!-- صفحة السحب -->
    <main id="page-withdraw" class="page">
      <h2 style="font-size: 15px; color: #d8f3dc; margin-bottom: 12px; text-shadow: 2px 2px #000;">💳 سحب المحفظة</h2>
      
      <div class="pixel-box" style="text-align: right;">
        <p style="font-size: 12px; color: #b7e4c7;">📌 الحد الأدنى للسحب هو: <b style="color: #74c69d;">0.085 USDT</b></p>
        
        <label style="display: block; font-size: 11px; margin-top: 10px; color: #d8f3dc;">عنوان محفظة BEP20:</label>
        <input type="text" id="wallet-address" class="pixel-input" placeholder="0x..." />
        
        <button class="pixel-btn btn-withdraw" onclick="submitWithdrawal()">
          📤 إرسال طلب السحب
        </button>
      </div>
    </main>

    <!-- الشريط السفلي -->
    <nav class="bottom-nav">
      <button class="nav-item active" onclick="switchPage('home', this)">
        <span class="nav-icon">⚔️</span>
        <span>الرئيسية</span>
      </button>
      <button class="nav-item" onclick="switchPage('tasks', this)">
        <span class="nav-icon">📜</span>
        <span>المهام</span>
      </button>
      <button class="nav-item" onclick="switchPage('withdraw', this)">
        <span class="nav-icon">💰</span>
        <span>السحب</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // إعدادات البوت والشبكة
    const ADSGRAM_BLOCK_ID = "40248"; 
    const BOT_TOKEN = "YOUR_BOT_TOKEN"; 
    const ADMIN_CHAT_ID = "YOUR_ADMIN_CHAT_ID"; 
    const MIN_WITHDRAW = 0.085;
    const AD_REWARD = 0.005;
    const TASK_REWARD = 0.004;
    const COOLDOWN_TIME = 30 * 60 * 1000; // 30 دقيقة

    let userBalance = 0.0000;
    let lastAdTimestamp = 0;
    let isTaskDone = false;

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-display-name').innerText = tg.initDataUnsafe.user.first_name || "الفارس";
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function switchPage(pageId, element) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      element.classList.add('active');
    }

    function updateBalance() {
      document.getElementById('user-balance').innerText = userBalance.toFixed(4);
      localStorage.setItem('userBalance', userBalance.toString());
    }

    function loadData() {
      const savedBalance = localStorage.getItem('userBalance');
      if (savedBalance !== null) userBalance = parseFloat(savedBalance);
      
      const savedAdTime = localStorage.getItem('lastAdTimestamp');
      if (savedAdTime !== null) lastAdTimestamp = parseInt(savedAdTime);

      const taskStatus = localStorage.getItem('isChannelTaskDone');
      if (taskStatus === 'true') {
        isTaskDone = true;
        disableTaskBtn();
      }

      updateBalance();
      checkAdCooldown();
    }

    // إدارة مؤقت 30 دقيقة للإعلان
    function checkAdCooldown() {
      const adBtn = document.getElementById('ad-btn');
      const timerDisplay = document.getElementById('timer-display');
      const now = Date.now();
      const elapsed = now - lastAdTimestamp;

      if (elapsed < COOLDOWN_TIME) {
        adBtn.disabled = true;
        timerDisplay.style.display = 'block';
        
        const remainingMs = COOLDOWN_TIME - elapsed;
        const minutes = Math.floor(remainingMs / 60000);
        const seconds = Math.floor((remainingMs % 60000) / 1000);
        
        timerDisplay.innerText = `⏳ المتبقي: ${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        setTimeout(checkAdCooldown, 1000);
      } else {
        adBtn.disabled = false;
        timerDisplay.style.display = 'none';
        adBtn.innerText = "🎬 مشاهدة الإعلان (+0.005$)";
      }
    }

    // تشغيل الإعلان
    function watchAd() {
      const now = Date.now();
      if (now - lastAdTimestamp < COOLDOWN_TIME) {
        showToast("⚠️ يرجى الانتظار لحين انتهاء الوقت!");
        return;
      }

      if (window.Adsgram) {
        const AdController = window.Adsgram.init({ blockId: ADSGRAM_BLOCK_ID });
        AdController.show().then(() => {
          grantAdReward();
        }).catch(() => {
          showToast("❌ لم يتم اكتمال مشاهدة الإعلان!");
        });
      } else {
        // وضع تجريبي في حال الاختبار خارج تلجرام
        grantAdReward();
      }
    }

    function grantAdReward() {
      userBalance += AD_REWARD;
      lastAdTimestamp = Date.now();
      localStorage.setItem('lastAdTimestamp', lastAdTimestamp.toString());
      updateBalance();
      checkAdCooldown();
      showToast("🎉 تمت إضافة +0.005$ إلى رصيدك!");
    }

    // مهمة القناة
    function doChannelTask() {
      if (isTaskDone) return;
      
      const channelUrl = "https://t.me/madara_crypto20";
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink(channelUrl);
      } else {
        window.open(channelUrl, '_blank');
      }

      showToast("⏳ يتم التحقق... اضغط لتأكيد الاستلام بعد الانضمام");
      
      const btn = document.getElementById('channel-task-btn');
      btn.innerText = "✅ تأكيد الانضمام والاستلام";
      btn.onclick = () => {
        userBalance += TASK_REWARD;
        isTaskDone = true;
        localStorage.setItem('isChannelTaskDone', 'true');
        updateBalance();
        disableTaskBtn();
        showToast("🎉 تم إضافة +0.004$ لحسابك!");
      };
    }

    function disableTaskBtn() {
      const btn = document.getElementById('channel-task-btn');
      btn.innerText = "✔️ تم إنجاز المهمة";
      btn.disabled = true;
      btn.style.background = "#2d6a4f";
      btn.style.color = "#b7e4c7";
    }

    // طلب السحب
    function submitWithdrawal() {
      const wallet = document.getElementById('wallet-address').value.trim();
      
      if (!wallet || wallet.length < 10) {
        showToast("⚠️ يرجى إدخال عنوان محفظة صحيح!");
        return;
      }

      if (userBalance < MIN_WITHDRAW) {
        showToast(`⚠️ الرصيد غير كافٍ! الحد الأدنى ${MIN_WITHDRAW}$`);
        return;
      }

      const userName = tg?.initDataUnsafe?.user?.first_name || 'غير معروف';
      const userId = tg?.initDataUnsafe?.user?.id || 'غير معروف';
      
      const message = `⚔️ *طلب سحب جديد (Pixel Fantasy)*\n\n` +
                      `👤 *المستخدم:* ${userName}\n` +
                      `🆔 *الآيدي:* \`${userId}\`\n` +
                      `💰 *المبلغ:* \`${userBalance.toFixed(4)} USDT\`\n` +
                      `🏦 *المحفظة (BEP20):*\n\`${wallet}\``;

      fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: ADMIN_CHAT_ID, text: message, parse_mode: 'Markdown' })
      })
      .then(() => {
        userBalance = 0;
        updateBalance();
        document.getElementById('wallet-address').value = '';
        showToast("✅ تم إرسال طلب السحب بنجاح!");
      })
      .catch(() => {
        showToast("❌ حدث خطأ في الاتصال، حاول مجدداً.");
      });
    }

    window.onload = loadData;
  </script>
</body>
</html>
