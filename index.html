<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madara Crypto — Pixel Forest</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Adsgram SDK -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
    <style>
        /* ============================================================
           الجزء الأول: الأساسيات + الخلفية البيكسليّة + القمر + الغابة
           ============================================================ */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            image-rendering: pixelated;
        }

        @font-face {
            font-family: 'PixelFont';
            src: local('Courier New'), local('Arial');
            font-weight: bold;
        }

        body {
            background: #0a0f1a;
            background-image:
                /* طبقة نسيج بيكسلي (مربعات صغيرة) */
                linear-gradient(45deg, rgba(20, 30, 20, 0.3) 1px, transparent 1px),
                linear-gradient(-45deg, rgba(20, 30, 20, 0.3) 1px, transparent 1px),
                radial-gradient(circle at 20% 30%, #142e1e 0%, #03060b 90%);
            background-size: 12px 12px, 12px 12px, 100% 100%;
            color: #e0f0e0;
            font-family: 'PixelFont', 'Segoe UI', monospace;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 90px;
            text-shadow: 2px 2px 0 #0a1a0a;
        }

        /* القمر البيكسلي (مربّع تقريباً) */
        .moon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 58px;
            height: 58px;
            background: #f9f3d9;
            border-radius: 4px;
            box-shadow: 0 0 0 4px #2d3a2d, 0 0 20px #c8e6b0, 0 0 40px #6d8f5a;
            z-index: 2;
            image-rendering: pixelated;
            transform: rotate(0deg);
            border: 2px solid #1f2a1f;
        }
        .moon::after {
            content: "◆";
            font-size: 32px;
            color: #2d3a2d;
            position: absolute;
            top: 12px;
            left: 12px;
            opacity: 0.3;
            letter-spacing: -8px;
        }

        /* النجوم (بيكسلات بيضاء) */
        .star {
            position: fixed;
            background: #f5ffe0;
            width: 6px;
            height: 6px;
            box-shadow: 0 0 0 1px #a0b080;
            animation: twinkle var(--duration) infinite alternate;
            z-index: 1;
            image-rendering: pixelated;
            border: 1px solid #2a3a1a;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.2); }
        }

        /* الثلج البيكسلي (❄︎ بحجم كبير) */
        .snowflake {
            position: fixed;
            top: -20px;
            color: #d4f0d4;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
            font-size: 22px;
            text-shadow: 0 0 4px #1f3a1f;
            image-rendering: pixelated;
            font-family: 'Courier New', monospace;
            transform: rotate(0deg);
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        /* غابة البيكسل (أسفل الشاشة) — حواف خشنة */
        .pixel-trees {
            position: fixed;
            bottom: 70px;
            width: 100%;
            height: 60px;
            background:
                repeating-linear-gradient(90deg,
                    #0b1f0b 0px, #0b1f0b 8px,
                    transparent 8px, transparent 16px
                );
            opacity: 0.8;
            pointer-events: none;
            z-index: 2;
            border-top: 4px solid #1f3a1f;
            box-shadow: inset 0 -20px 30px rgba(0,0,0,0.7);
            image-rendering: pixelated;
        }
        .pixel-trees::before {
            content: "▲ ▲ ▲ ▲ ▲ ▲ ▲";
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 100%;
            font-size: 26px;
            letter-spacing: 18px;
            color: #102510;
            text-shadow: 0 4px 0 #0b1f0b, 0 8px 0 #061006;
            white-space: nowrap;
            overflow: hidden;
        }
