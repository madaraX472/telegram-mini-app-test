<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA EARN</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial;
}


body{

margin:0;
background:
linear-gradient(180deg,#020617,#111827);

color:white;

}



.app{

max-width:450px;
margin:auto;
padding:20px;

}



.header{

text-align:center;
padding:25px;

}


.icon{

font-size:70px;

}



.title{

font-size:34px;
font-weight:bold;
color:#facc15;

}



.subtitle{

color:#aaa;

}



.card{

background:#0f172a;

border:1px solid #273244;

border-radius:25px;

padding:20px;

margin-bottom:18px;

box-shadow:0 10px 30px #0005;

}



.balance{

background:
linear-gradient(135deg,#facc15,#ea580c);

color:#111;

text-align:center;

border-radius:22px;

padding:25px;

}



.balance h1{

font-size:48px;
margin:10px;

}



.stats{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

}



.box{

background:#020617;

border-radius:18px;

padding:15px;

text-align:center;

}



.box b{

display:block;

font-size:25px;

color:#facc15;

}



button{

width:100%;

border:0;

border-radius:20px;

padding:17px;

font-size:18px;

font-weight:bold;

margin-top:12px;

}



.ads{

background:#22c55e;

color:white;

}



.lock{

background:#1e293b;

color:#94a3b8;

}



.invite{

background:#f59e0b;

}



.withdraw{

background:#2563eb;

color:white;

}



.msg{

display:none;

background:#16a34a;

padding:12px;

border-radius:15px;

text-align:center;

margin-bottom:15px;

}



.footer{

text-align:center;

color:#777;

font-size:13px;

}



.loading{

opacity:.6;

}


</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="icon">
🌌
</div>


<div class="title">
NOVA EARN
</div>


<div class="subtitle">
منصة الربح من الإعلانات
</div>


</div>



<div id="msg" class="msg"></div>



<div class="card">


<div class="balance">

رصيدك الحالي

<h1 id="points">
0
</h1>

نقطة

</div>


</div>




<div class="card">


<div class="stats">


<div class="box">

<b id="ads">
0</b>

إعلانات

</div>


<div class="box">

<b id="level">
1</b>

المستوى

</div>


</div>


</div>




<div class="card">


<h2>
🎬 مشاهدة الإعلانات
</h2>


<p>
احصل على نقاط مجانية يومياً
</p>


<button class="ads">

🎥 مشاهدة إعلان +10 نقاط

</button>


</div>




<div class="card">


<button class="invite">

👥 دعوة الأصدقاء

</button>



<button class="withdraw">

💸 السحب

</button>


<button class="lock">

📋 المهام (ستضاف قريباً)

</button>


<button class="lock">

📊 الحالة (ستضاف قريباً)

</button>



</div>




<div class="footer">

NOVA EARN © 2026

</div>


</div>




<script>


let points =
Number(localStorage.getItem("points")) || 0;


let ads =
Number(localStorage.getItem("ads")) || 0;



function update(){

document.getElementById("points").innerHTML =
points.toLocaleString();


document.getElementById("ads").innerHTML =
ads;


document.getElementById("level").innerHTML =
Math.floor(points/100)+1;


localStorage.setItem("points",points);

localStorage.setItem("ads",ads);

}


update();



function message(text){

let box=document.getElementById("msg");

box.innerHTML=text;

box.style.display="block";


setTimeout(()=>{

box.style.display="none";

},3000);


}




const AdController =
window.Adsgram.init({

blockId:"40248"

});





document.querySelector(".ads").onclick=async function(){


let btn=this;


btn.classList.add("loading");


btn.innerHTML="⏳ جاري تشغيل الإعلان...";


setTimeout(async()=>{


try{


await AdController.show();


points+=10;

ads++;


update();


message("🎉 تم إضافة 10 نقاط");


}

catch(e){


message("❌ لا يوجد إعلان متاح");


}



btn.classList.remove("loading");

btn.innerHTML="🎥 مشاهدة إعلان +10 نقاط";


},3000);



};






document.querySelector(".invite").onclick=function(){


message("👥 نظام الدعوات سيضاف قريباً");


};





document.querySelector(".withdraw").onclick=function(){


message("💸 نظام السحب سيضاف قريباً");


};



</script>


</body>

</html>
