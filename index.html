<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madara Crypto</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(to bottom, #030712, #0b1329, #111827);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* خلفية السماء والقمر */
        .moon {
            position: absolute;
            top: 30px;
            right: 30px;
            width: 70px;
            height: 70px;
            background: #fefefe;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(147, 197, 253, 0.6);
            z-index: 2;
        }

        /* تأثير الثلج */
        .snowflake {
            position: fixed;
            top: -10px;
            color: #ffffff;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh);
            }
        }

        /* بطاقة المحتوى الرئيسية */
        .container {
            width: 90%;
            max-width: 400px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .balance-title {
            font-size: 14px;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .balance-value {
            font-size: 36px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        /* الأزرار */
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-bottom: 12px;
        }

        .btn-action:active {
            transform: scale(0.97);
        }

        /* إشعار الـ Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 41, 55, 0.95);
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 14px;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
    <body>
    <!-- عناصر الخلفية -->
    <div class="moon"></div>

    <!-- بطاقة الواجهة -->
    <div class="container">
        <h2 style="margin-bottom: 15px; font-size: 20px;">🎮 Madara Crypto</h2>
        
        <div class="balance-title">الرصيد الحالي (USDT)</div>
        <div class="balance-value" id="user-balance">0.00</div>

        <button id="adsterra-btn" class="btn-action" onclick="handleAdsterraClick()">
            ▶ مشاهدة إعلان (Adsterra)
        </button>
    </div>

    <!-- حاوية الإشعارات -->
    <div id="toast" class="toast"></div>
           <script>
        // إعدادات البوت والشبكة
        const ADSTERRA_URL = "https://example.com"; // ضع رابط Adsterra Smartlink هنا
        const REWARD_ADSTERRA = 0.01;
        const ADSTERRA_WAIT_SECONDS = 12;

        let userBalance = 0.00;
        let isAdsterraPending = false;
        let adsterraTimer = null;

        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // إظهار إشعار مؤقت
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        // تحديث وحفظ الرصيد
        function updateBalance() {
            const balanceElem = document.getElementById('user-balance');
            if (balanceElem) {
                balanceElem.innerText = userBalance.toFixed(2);
            }
            localStorage.setItem('userBalance', userBalance.toString());
        }

        function markAdWatched() {
            localStorage.setItem('adWatched', 'true');
        }

        function loadUserData() {
            const savedBalance = localStorage.getItem('userBalance');
            if (savedBalance !== null) {
                userBalance = parseFloat(savedBalance);
                updateBalance();
            }
        }

        // معالجة ضغطة الإعلان والتحقق (Anti-Cheat)
        function handleAdsterraClick() {
            const btn = document.getElementById('adsterra-btn');

            if (!isAdsterraPending) {
                if (tg && tg.openLink) {
                    tg.openLink(ADSTERRA_URL);
                } else {
                    window.open(ADSTERRA_URL, '_blank');
                }

                isAdsterraPending = true;
                adsterraTimer = Date.now();
                btn.innerText = "🎁 استلام المكافأة";
                showToast("⏱ ابق في صفحة الإعلان لمدة 12 ثانية");
            } else {
                const elapsedSeconds = Math.floor((Date.now() - adsterraTimer) / 1000);

                if (elapsedSeconds < ADSTERRA_WAIT_SECONDS) {
                    const remaining = ADSTERRA_WAIT_SECONDS - elapsedSeconds;
                    showToast(`⚠️ انتظر ${remaining} ثانية أخرى!`);
                } else {
                    userBalance += REWARD_ADSTERRA;
                    updateBalance();
                    markAdWatched();

                    isAdsterraPending = false;
                    btn.innerText = "▶ مشاهدة إعلان (Adsterra)";
                    showToast("🎉 حصلت على المكافأة بنجاح!");
                }
            }
        }

        // توليد الثلج
        function createSnowflakes() {
            for (let i = 0; i < 25; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = '❄';
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                flake.style.opacity = Math.random();
                flake.style.fontSize = (Math.random() * 8 + 10) + 'px';
                document.body.appendChild(flake);
            }
        }

        // عند فتح الصفحة
        window.onload = function() {
            loadUserData();
            createSnowflakes();
        };
    </script>
</body>
</html>
