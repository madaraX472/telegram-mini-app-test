<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Libya Rewards</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<style>

*{
box-sizing:border-box;
font-family:Tajawal,Arial;
}

body{
margin:0;
background:#080f1f;
color:white;
}

.app{
padding:20px;
max-width:450px;
margin:auto;
}

.header{
text-align:center;
padding:25px;
}

.logo{
font-size:45px;
}

.title{
font-size:28px;
font-weight:bold;
}

.desc{
color:#94a3b8;
}


.balance{

background:linear-gradient(135deg,#22c55e,#16a34a);
border-radius:25px;
padding:25px;
text-align:center;
margin:20px 0;

}

.balance h1{
font-size:45px;
margin:10px 0;
}



.card{

background:#111827;
border-radius:25px;
padding:20px;
box-shadow:0 0 25px #0008;

}


button{

width:100%;
padding:17px;
border:0;
border-radius:18px;
margin-top:15px;
font-size:18px;
font-weight:bold;
color:white;

}


.ad{
background:#22c55e;
}

.withdraw{
background:#2563eb;
}

.invite{
background:#f59e0b;
}


.info{

margin-top:20px;
background:#1e293b;
padding:15px;
border-radius:15px;
color:#cbd5e1;

}


</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="logo">
🪙
</div>

<div class="title">
Libya Rewards
</div>

<div class="desc">
اربح النقاط من مشاهدة الإعلانات
</div>


</div>



<div class="balance">

رصيدك

<h1 id="points">
0
</h1>

نقطة

</div>



<div class="card">


<button class="ad">
🎥 مشاهدة إعلان +10
</button>


<button class="withdraw">
💸 طلب سحب
</button>


<button class="invite">
👥 دعوة الأصدقاء
</button>



<div class="info">

⭐ كل إعلان مكتمل = 10 نقاط

<br><br>

🚀 المزيد من الميزات قريباً

</div>


</div>


</div>





<script>


let points = localStorage.getItem("points") || 0;

document.getElementById("points").innerHTML = points;



// AdsGram

const AdController = window.Adsgram.init({

blockId:"40248"

});




// مشاهدة الإعلان


document.querySelector(".ad").onclick = async function(){


try{


let result = await AdController.show();

points = Number(points) + 10;


localStorage.setItem(
"points",
points
);


document.getElementById("points").innerHTML = points;


alert("🎉 تمت إضافة 10 نقاط");


}

catch(e){


console.log(e);


alert("❌ لم يكتمل الإعلان");


}


};





// السحب


document.querySelector(".withdraw").onclick=function(){

alert("💸 نظام السحب قيد التطوير");

};




// الدعوات


document.querySelector(".invite").onclick=function(){

alert("👥 نظام الدعوات سيتم إضافته قريباً");

};



</script>


</body>
</html>
