<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rail Rush Rewards</title>

<script src="https://sad.adsgram.ai/js/sad.min.js"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial;
}


body{

margin:0;
background:#020617;
color:white;
text-align:center;

}


.game{

width:360px;
height:600px;
margin:auto;
overflow:hidden;
background:
linear-gradient(#334155,#020617);

position:relative;
border-radius:25px;

}



.title{

font-size:30px;
font-weight:bold;
color:#facc15;
margin:15px;

}


.score{

font-size:22px;
margin-bottom:10px;

}



.road{

position:absolute;
top:0;
bottom:0;
left:0;
right:0;

display:flex;

}



.line{

width:33.3%;
border-left:2px dashed #64748b;

}



.player{

position:absolute;

bottom:40px;

font-size:45px;

transition:.2s;

}



.enemy{

position:absolute;

top:-60px;

font-size:45px;

}



.coin{

position:absolute;

top:-50px;

font-size:35px;

}



button{

width:90%;
padding:15px;

border:0;

border-radius:20px;

font-size:18px;

font-weight:bold;

margin:10px;

}



.start{

background:#22c55e;

color:white;

}



.ad{

background:#facc15;

display:none;

}



.message{

font-size:25px;

color:#ef4444;

}



</style>


</head>



<body>



<h1 class="title">
🚇 Rail Rush Rewards
</h1>


<div class="score">

🪙 العملات:
<span id="coins">0</span>

</div>



<div class="game" id="game">


<div class="road">

<div class="line"></div>

<div class="line"></div>

<div class="line"></div>

</div>


<div class="player" id="player">

🏃

</div>


</div>



<div id="msg" class="message"></div>


<button class="start" id="start">

▶️ بدء اللعب

</button>


<button class="ad" id="ad">

🎬 شاهد إعلان واستمر

</button>




<script>


let lane=1;

let coins=0;

let playing=false;

let speed=5;



const player=
document.getElementById("player");

const game=
document.getElementById("game");

const coinText=
document.getElementById("coins");

const msg=
document.getElementById("msg");



let enemy;

let coin;



function movePlayer(){

player.style.left=
(lane*120+35)+"px";

}


movePlayer();




document.addEventListener("keydown",e=>{


if(e.key=="ArrowLeft" && lane>0){

lane--;

movePlayer();

}



if(e.key=="ArrowRight" && lane<2){

lane++;

movePlayer();

}


});




// لمس الهاتف


document.addEventListener("touchstart",e=>{


let x=e.touches[0].clientX;


if(x < window.innerWidth/2 && lane>0){

lane--;

}


else if(lane<2){

lane++;

}


movePlayer();


});







function createEnemy(){


enemy=document.createElement("div");

enemy.className="enemy";

enemy.innerHTML="🚆";


enemy.style.left=
(laneRandom()*120+35)+"px";


enemy.style.top="-60px";


game.appendChild(enemy);



}



function createCoin(){


coin=document.createElement("div");

coin.className="coin";

coin.innerHTML="🪙";


coin.style.left=
(laneRandom()*120+45)+"px";


coin.style.top="-40px";


game.appendChild(coin);


}




function laneRandom(){

return Math.floor(Math.random()*3);

}





function startGame(){


playing=true;

coins=0;

coinText.innerHTML=coins;

msg.innerHTML="";


document.getElementById("ad").style.display="none";


enemy=null;

coin=null;



gameLoop();


}





function gameLoop(){


if(!playing)return;



if(!enemy){

createEnemy();

}



if(!coin){

createCoin();

}




if(enemy){

let y=parseInt(enemy.style.top);

y+=speed;

enemy.style.top=y+"px";



let playerLane=lane;


let enemyLane=
Math.floor(parseInt(enemy.style.left)/120);



if(y>500 && playerLane==enemyLane){

endGame();

return;

}



if(y>620){

enemy.remove();

enemy=null;

}


}



if(coin){


let y=parseInt(coin.style.top);

y+=speed;

coin.style.top=y+"px";


let coinLane=
Math.floor(parseInt(coin.style.left)/120);



if(y>500 && lane==coinLane){


coins++;

coinText.innerHTML=coins;


coin.remove();

coin=null;


}



if(y>620){

coin.remove();

coin=null;

}



}



requestAnimationFrame(gameLoop);



}






function endGame(){


playing=false;


enemy.remove();


msg.innerHTML=
"💥 انتهت الجولة";


document.getElementById("ad").style.display="block";


}





document.getElementById("start").onclick=startGame;







const AdController =
window.Adsgram.init({

blockId:"40248"

});





document.getElementById("ad").onclick=async()=>{


document.getElementById("ad").innerHTML=
"⏳ جاري تشغيل الإعلان...";


setTimeout(async()=>{


try{


await AdController.show();


msg.innerHTML=
"🔥 أكمل اللعب!";


document.getElementById("ad").style.display="none";


playing=true;

gameLoop();



}

catch(e){


msg.innerHTML=
"❌ لا يوجد إعلان";


}



document.getElementById("ad").innerHTML=
"🎬 شاهد إعلان واستمر";


},3000);



};



</script>


</body>

</html>
