<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shadow Runner</title>

<style>

*{
box-sizing:border-box;
font-family:Arial;
}

body{
margin:0;
background:#050816;
color:white;
text-align:center;
overflow:hidden;
}


h1{
color:#38bdf8;
}


canvas{
display:block;
margin:auto;
background:#111827;
border-radius:25px;
box-shadow:0 0 30px #000;
}


button{
width:90%;
padding:15px;
margin:10px;
border:0;
border-radius:20px;
font-size:18px;
font-weight:bold;
}


#start{
background:#22c55e;
color:white;
}


#ad{
display:none;
background:#facc15;
}



</style>

</head>


<body>


<h1>🌃 Shadow Runner</h1>


<div>
النقاط:
<span id="score">0</span>
</div>


<canvas id="game" width="360" height="600"></canvas>


<button id="start">
▶ بدء اللعب
</button>


<button id="ad">
🎬 مشاهدة إعلان والمتابعة
</button>




<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let running=false;

let score=0;

let lane=1;

let speed=6;

let roadMove=0;



const lanes=[70,180,290];



let player={

x:180,
y:470,
run:0

};



let obstacles=[];

let batteries=[];



function drawBackground(){


ctx.fillStyle="#020617";

ctx.fillRect(0,0,360,600);



for(let i=0;i<7;i++){

ctx.fillStyle="#1e293b";

ctx.fillRect(
i*60,
120,
45,
200
);


}



}



function drawRoad(){


ctx.fillStyle="#334155";

ctx.fillRect(30,0,300,600);



ctx.strokeStyle="#94a3b8";

ctx.lineWidth=3;



ctx.beginPath();

ctx.moveTo(130,0);
ctx.lineTo(130,600);


ctx.moveTo(230,0);
ctx.lineTo(230,600);


ctx.stroke();



roadMove+=8;


if(roadMove>60)
roadMove=0;



ctx.strokeStyle="white";


for(let y=-60;y<600;y+=60){


ctx.beginPath();

ctx.moveTo(180,y+roadMove);

ctx.lineTo(180,y+30+roadMove);

ctx.stroke();


}



}



// رسم الشخصية


function drawPlayer(){


player.run++;


let move=Math.sin(player.run*0.3)*5;



// الرأس

ctx.fillStyle="#f5cfa0";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
15,
0,
Math.PI*2
);

ctx.fill();



// الجسم

ctx.fillStyle="#2563eb";

ctx.fillRect(
player.x-12,
player.y+15,
24,
35
);



// الأرجل

ctx.strokeStyle="#111";

ctx.lineWidth=6;


ctx.beginPath();

ctx.moveTo(
player.x,
player.y+50
);

ctx.lineTo(
player.x-10,
player.y+70+move
);


ctx.moveTo(
player.x,
player.y+50
);

ctx.lineTo(
player.x+10,
player.y+70-move
);


ctx.stroke();



}



function createObstacle(){

obstacles.push({

x:lanes[Math.floor(Math.random()*3)],
y:-50

});

}



function createBattery(){

batteries.push({

x:lanes[Math.floor(Math.random()*3)],
y:-30

});

}



function drawObstacle(o){

ctx.fillStyle="#ef4444";

ctx.fillRect(
o.x-20,
o.y,
40,
45
);

}



function drawBattery(b){

ctx.fillStyle="#22d3ee";

ctx.beginPath();

ctx.arc(
b.x,
b.y,
12,
0,
Math.PI*2
);

ctx.fill();

}
function collision(a,b){

return(
Math.abs(a.x-b.x)<40 &&
Math.abs(a.y-b.y)<50
);

}



function update(){


if(!running) return;


ctx.clearRect(0,0,360,600);


drawBackground();

drawRoad();



// إنشاء العوائق

if(Math.random()<0.025){

createObstacle();

}


if(Math.random()<0.03){

createBattery();

}



// تحريك العوائق

obstacles.forEach((o,index)=>{


o.y+=speed;


drawObstacle(o);



if(collision(player,o)){

gameOver();

}



if(o.y>650){

obstacles.splice(index,1);

}



});




// تحريك الطاقة

batteries.forEach((b,index)=>{


b.y+=speed;


drawBattery(b);



if(collision(player,b)){


score+=50;


document.getElementById("score").innerHTML=score;


batteries.splice(index,1);


}



if(b.y>650){

batteries.splice(index,1);

}


});



drawPlayer();



score++;

document.getElementById("score").innerHTML=score;



requestAnimationFrame(update);


}





function startGame(){


score=0;

lane=1;

player.x=lanes[lane];

obstacles=[];

batteries=[];


document.getElementById("score").innerHTML=0;


document.getElementById("ad").style.display="none";


running=true;


update();


}





function gameOver(){


running=false;


document.getElementById("ad").style.display="block";


}




// التحكم بالكمبيوتر

document.addEventListener("keydown",function(e){


if(e.key==="ArrowLeft" && lane>0){

lane--;

}


if(e.key==="ArrowRight" && lane<2){

lane++;

}


player.x=lanes[lane];


});




// التحكم بالهاتف

canvas.addEventListener("touchstart",function(e){


let x=e.touches[0].clientX;


if(x < window.innerWidth/2 && lane>0){

lane--;

}


else if(lane<2){

lane++;

}


player.x=lanes[lane];


});





document.getElementById("start").onclick=startGame;




// مكان AdsGram

let AdController;


try{

AdController=window.Adsgram.init({

blockId:"40248"

});


}catch(e){}





document.getElementById("ad").onclick=function(){


let btn=this;


btn.innerHTML="⏳ جاري تشغيل الإعلان...";


setTimeout(async()=>{


try{


if(AdController){

await AdController.show();

}


btn.style.display="none";


running=true;


update();



}catch(e){


btn.innerHTML="❌ لا يوجد إعلان";


}



},3000);



};



</script>


</body>

</html>
