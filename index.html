<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Libya Rewards</title>

<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
margin:0;
background:#050505;
color:white;
}

.app{
max-width:450px;
margin:auto;
padding:20px;
}


.header{
text-align:center;
padding:20px;
}


.logo{
font-size:55px;
}


.title{
font-size:30px;
font-weight:bold;
color:#facc15;
}


.user{
color:#aaa;
margin-top:10px;
}



.balance{

background:linear-gradient(135deg,#facc15,#ca8a04);
padding:25px;
border-radius:30px;
text-align:center;
color:#111;
box-shadow:0 0 30px #facc1555;

}


.balance h1{

font-size:45px;
margin:10px;

}



.grid{

display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-top:20px;

}



.box{

background:#111;
border-radius:20px;
padding:20px;
text-align:center;
border:1px solid #222;

}


.box span{

display:block;
font-size:25px;
color:#facc15;

}



.card{

background:#111;
padding:20px;
border-radius:25px;
margin-top:20px;

}



button{

width:100%;
padding:16px;
margin-top:12px;
border:0;
border-radius:18px;
font-size:18px;
font-weight:bold;
cursor:pointer;

}



.game{

background:#facc15;
color:#111;

}


.ad{

background:#22c55e;
color:white;

}



.coin{

font-size:90px;
text-align:center;
cursor:pointer;
user-select:none;
transition:.1s;

}


.coin:active{

transform:scale(.8);

}



.message{

text-align:center;
color:#aaa;
margin-top:10px;

}


</style>

</head>


<body>


<div class="app">


<div class="header">

<div class="logo">
🪙
</div>

<div class="title">
Libya Rewards
</div>

<div class="user">
مرحبا بك 👋
</div>

</div>



<div class="balance">

رصيدك

<h1 id="points">
0
</h1>

نقطة

</div>




<div class="grid">


<div class="box">
<span id="clicks">0</span>
نقرات اللعبة
</div>


<div class="box">
<span id="level">1</span>
المستوى
</div>


</div>





<div class="card">


<h2>
🎮 لعبة جمع النقاط
</h2>


<div class="coin" id="coin">
🪙
</div>


<div class="message">
اضغط على العملة واحصل على نقاط
</div>



<button class="game" onclick="addClick()">
اضغط للربح
</button>


</div>





<div class="card">


<h2>
🎁 المكافآت
</h2>


<button class="ad">
مشاهدة إعلان
</button>


</div>



</div>





<script>


let points =
Number(localStorage.getItem("points")) || 0;


let clicks =
Number(localStorage.getItem("clicks")) || 0;



function update(){

document.getElementById("points").innerHTML=points;

document.getElementById("clicks").innerHTML=clicks;


document.getElementById("level").innerHTML=
Math.floor(points/100)+1;


localStorage.setItem("points",points);

localStorage.setItem("clicks",clicks);

}



function addClick(){


points++;

clicks++;


update();


}



update();



</script>


</body>

</html>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>

<script>

let points = Number(localStorage.getItem("points")) || 0;
let ads = Number(localStorage.getItem("ads")) || 0;


// تحديث البيانات

function updateData(){

document.getElementById("points").innerHTML = points;

if(document.getElementById("ads")){
document.getElementById("ads").innerHTML = ads;
}

localStorage.setItem("points",points);
localStorage.setItem("ads",ads);

}

updateData();




// تشغيل AdsGram

const AdController = window.Adsgram.init({

blockId:"40248"

});





// زر الإعلان

const adButton = document.querySelector(".ad");


if(adButton){

adButton.onclick = async function(){


adButton.innerHTML="⏳ جاري تحميل الإعلان...";

adButton.disabled=true;


try{


await AdController.show();


// الإعلان اكتمل

points += 10;

ads++;


updateData();


alert("🎉 حصلت على 10 نقاط");


}


catch(error){


console.log(error);


alert("❌ لا يوجد إعلان متاح الآن، حاول لاحقاً");


}


adButton.innerHTML="🎬 مشاهدة إعلان +10 نقاط";

adButton.disabled=false;



};


}






// نظام السحب

const withdrawButton =
document.querySelector(".withdraw");


if(withdrawButton){

withdrawButton.onclick=function(){


if(points < 1000){

alert(
"⚠️ الحد الأدنى للسحب هو 1000 نقطة"
);

return;

}


alert(
"💸 تم إرسال طلب السحب"
);


}


}







// نظام الإحالة


const inviteButton =
document.querySelector(".invite");


if(inviteButton){


inviteButton.onclick=function(){


let link =
"https://t.me/test_rewards_libya_bot";


navigator.clipboard.writeText(link);


alert(
"✅ تم نسخ رابط الدعوة"
);


}


}






// Telegram Mini App


if(window.Telegram && Telegram.WebApp){


Telegram.WebApp.ready();


let user =
Telegram.WebApp.initDataUnsafe.user;


if(user){


let name =
user.first_name || "مستخدم";


let userElement =
document.querySelector(".user");


if(userElement){

userElement.innerHTML =
"👤 "+name;

}


}


}





</script>
