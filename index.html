<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Madara Crypto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: linear-gradient(to bottom, #030712, #0b1329, #111827);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 70px;
        }

        /* خلفية السماء والقمر والثلج */
        .moon {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 65px;
            height: 65px;
            background: #fefefe;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.9), 0 0 50px rgba(147, 197, 253, 0.5);
            z-index: 2;
        }

        .snowflake {
            position: fixed;
            top: -10px;
            color: #ffffff;
            user-select: none;
            z-index: 1;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            to { transform: translateY(105vh); }
        }

        /* الحاوية الرئيسية */
        .app-container {
            width: 90%;
            max-width: 400px;
            margin-top: 80px;
            background: rgba(17, 24, 39, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            z-index: 10;
        }

        .page { display: none; }
        .page.active { display: block; }

        .balance-title { font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        .balance-value { font-size: 36px; font-weight: bold; color: #38bdf8; margin-bottom: 20px; }

        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            margin-bottom: 10px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: white;
            margin-bottom: 12px;
            text-align: center;
        }

        /* القائمة السفلية */
        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 400px;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .nav-item {
            color: #9ca3af;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .nav-item.active { color: #38bdf8; font-weight: bold; }

        .toast {
            position: fixed;
            bottom: 75px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(31, 41, 55, 0.95);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 13px;
            z-index: 1000;
            display: none;
        }
    </style>
</head>
    <body>
    <div class="moon"></div>

    <div class="app-container">
        <!-- الصفحة الأولى: الرئيسية -->
        <div id="page-home" class="page active">
            <h2 style="margin-bottom: 15px;">🎮 Madara Crypto</h2>
            <div class="balance-title">الرصيد الحالي (USDT)</div>
            <div class="balance-value user-balance">0.00</div>
            <button id="adsterra-btn" class="btn-action" onclick="handleAdsterraClick()">▶ مشاهدة إعلان (Adsterra)</button>
        </div>

        <!-- الصفحة الثانية: الإحالات -->
        <div id="page-referral" class="page">
            <h2>👥 نظام الإحالة</h2>
            <p style="color: #9ca3af; margin: 15px 0; font-size: 14px;">شارِك رابطك مع أصدقائك واحصل على 10% من أرباحهم!</p>
            <input type="text" id="ref-link" class="input-field" readonly value="https://t.me/MadaraCryptoBot?start=user">
            <button class="btn-action" onclick="copyRefLink()">📋 نسخ الرابط</button>
        </div>

        <!-- الصفحة الثالثة: السحب -->
        <div id="page-withdraw" class="page">
            <h2>💸 سحب الأرباح</h2>
            <div class="balance-title" style="margin-top:10px;">الرصيد المتاح</div>
            <div class="balance-value user-balance">0.00</div>
            <p style="font-size: 12px; color: #9ca3af; margin-bottom: 10px;">الحد الأدنى للسحب: 0.05 USDT (BEP20)</p>
            <input type="text" id="wallet-address" class="input-field" placeholder="عنوان محفظة USDT (BEP20)">
            <button class="btn-action" onclick="submitWithdrawal()">طلب السحب</button>
        </div>
    </div>

    <!-- الشريط السفلي للتنقل -->
    <div class="nav-bar">
        <div class="nav-item active" onclick="switchPage('home', this)">🏠 الرئيسية</div>
        <div class="nav-item" onclick="switchPage('referral', this)">👥 الإحالات</div>
        <div class="nav-item" onclick="switchPage('withdraw', this)">💳 السحب</div>
    </div>

    <div id="toast" class="toast"></div>
        <script>
        const ADSTERRA_URL = "https://example.com"; // رابط Smartlink
        const REWARD_ADSTERRA = 0.01;
        const ADSTERRA_WAIT_SECONDS = 12;

        let userBalance = 0.00;
        let isAdsterraPending = false;
        let adsterraTimer = null;

        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => { t.style.display = 'none'; }, 3000);
        }

        // التنقل بين الصفحات
        function switchPage(pageId, element) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(`page-${pageId}`).classList.add('active');
            element.classList.add('active');
        }

        function updateBalance() {
            document.querySelectorAll('.user-balance').forEach(el => {
                el.innerText = userBalance.toFixed(2);
            });
            localStorage.setItem('userBalance', userBalance.toString());
        }

        function loadUserData() {
            const savedBalance = localStorage.getItem('userBalance');
            if (savedBalance !== null) {
                userBalance = parseFloat(savedBalance);
                updateBalance();
            }
        }

        // إعلان Adsterra
        function handleAdsterraClick() {
            const btn = document.getElementById('adsterra-btn');

            if (!isAdsterraPending) {
                if (tg && tg.openLink) {
                    tg.openLink(ADSTERRA_URL);
                } else {
                    window.open(ADSTERRA_URL, '_blank');
                }
                isAdsterraPending = true;
                adsterraTimer = Date.now();
                btn.innerText = "🎁 استلام المكافأة";
                showToast("⏱ ابق في صفحة الإعلان لمدة 12 ثانية");
            } else {
                const elapsedSeconds = Math.floor((Date.now() - adsterraTimer) / 1000);
                if (elapsedSeconds < ADSTERRA_WAIT_SECONDS) {
                    showToast(`⚠️ انتظر ${ADSTERRA_WAIT_SECONDS - elapsedSeconds} ثانية أخرى!`);
                } else {
                    userBalance += REWARD_ADSTERRA;
                    updateBalance();
                    isAdsterraPending = false;
                    btn.innerText = "▶ مشاهدة إعلان (Adsterra)";
                    showToast("🎉 حصلت على المكافأة بنجاح!");
                }
            }
        }

        function copyRefLink() {
            const copyText = document.getElementById("ref-link");
            navigator.clipboard.writeText(copyText.value);
            showToast("📋 تم نسخ رابط الإحالة!");
        }

        function submitWithdrawal() {
            const wallet = document.getElementById('wallet-address').value;
            if (!wallet) {
                showToast("⚠️ يرجى أدخال عنوان المحفظة");
                return;
            }
            if (userBalance < 0.05) {
                showToast("⚠️ رصيدك أقل من الحد الأدنى (0.05)");
                return;
            }
            showToast("✅ تم إرسال طلب السحب للإدارة!");
        }

        function createSnowflakes() {
            for (let i = 0; i < 20; i++) {
                const flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = '❄';
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                flake.style.opacity = Math.random();
                flake.style.fontSize = (Math.random() * 8 + 10) + 'px';
                document.body.appendChild(flake);
            }
        }

        window.onload = function() {
            loadUserData();
            createSnowflakes();
        };
    </script>
</body>
</html>
